<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vetrail · Schedule appointment</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/vetrail.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:#5F6B7C}
.crumb a{text-decoration:none;font-weight:500}
.rs{display:flex;flex-wrap:wrap;gap:8px}
.ch{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #D5DAE1;background:#fff;font:500 13px Inter,sans-serif;color:#3F4A5A;cursor:pointer}
.ch:hover{border-color:#0B62B5;color:#0B62B5}
.ch.on{background:#0B62B5;border-color:#0B62B5;color:#fff}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dy{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 0;border-radius:14px;border:1px solid #E8EBF0;background:#fff;cursor:pointer;font:inherit;color:#0F1B2A}
.dy span{font-size:12px;color:#5F6B7C}
.dy b{font:600 20px Outfit,sans-serif}
.dy:hover{border-color:#0B62B5}
.dy.on{background:#073B66;border-color:#073B66;color:#fff}
.dy.on span{color:#BFD3E6}
.dy:disabled{background:#F3F5F8;color:#9AA3AF;cursor:not-allowed;border-color:#F3F5F8}
.dy:disabled span{color:#9AA3AF}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.sl{min-height:44px;border-radius:12px;border:1px solid #E8EBF0;background:#fff;font:500 13px Inter,sans-serif;color:#0F1B2A;cursor:pointer}
.sl:hover{border-color:#0B62B5;color:#0B62B5}
.sl.on{background:#EAF2FB;border-color:#0B62B5;color:#0B62B5;font-weight:600}
.sum{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #EEF1F4}
.sum:last-child{border-bottom:0}
.sum dt{color:#5F6B7C}.sum dd{margin:0;font-weight:600;text-align:right}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/preact.min.js"></script>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 'pick', reason: 'Annual check-up', day: 26, time: '10:00 AM' }; }
  renderVals() {
    const s = this.state || {};
    const step = s.step || 'pick';
    const R = ['Annual check-up', 'Vaccination', 'Illness / injury', 'Preventative treatment', 'Routine wellness', 'Surgery consult', 'Other'];
    const D = [['Mon', 24], ['Tue', 25], ['Wed', 26], ['Thu', 27], ['Fri', 28], ['Sat', 29], ['Sun', 30]];
    const T = ['9:00 AM', '9:30 AM', '10:00 AM', '10:30 AM', '11:00 AM', '11:30 AM', '1:00 PM', '1:30 PM', '2:00 PM', '3:00 PM', '3:30 PM', '4:30 PM'];
    const full = { Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday', Thu: 'Thursday', Fri: 'Friday', Sat: 'Saturday', Sun: 'Sunday' };
    const dd = D.find((d) => d[1] === s.day) || D[2];
    return {
      title: step === 'done' ? 'Appointment confirmed' : step === 'review' ? 'Review appointment' : 'Schedule appointment',
      isPick: step === 'pick', isReview: step === 'review', isDone: step === 'done',
      reasons: R.map((r) => ({ label: r, cls: r === s.reason ? 'ch on' : 'ch', pressed: r === s.reason ? 'true' : 'false', pick: () => this.setState({ reason: r }) })),
      days: D.map((d) => ({ dow: d[0], n: d[1], off: d[0] === 'Sun', cls: d[1] === s.day ? 'dy on' : 'dy', pressed: d[1] === s.day ? 'true' : 'false', pick: () => this.setState({ day: d[1] }) })),
      slots: T.map((t) => ({ label: t, cls: t === s.time ? 'sl on' : 'sl', pressed: t === s.time ? 'true' : 'false', pick: () => this.setState({ time: t }) })),
      reason: s.reason, time: s.time,
      dayLabel: full[dd[0]] + ', March ' + dd[1],
      toPick: () => this.setState({ step: 'pick' }),
      toReview: () => this.setState({ step: 'review' }),
      toDone: () => this.setState({ step: 'done' })
    };
  }
}
DCLite.mount(Component, "\n\n<div class=\"app\">\n<nav class=\"side\" aria-label=\"Main navigation\">\n<a class=\"brand\" href=\"index.html\"><img src=\"assets/logo.png\" alt=\"\">Vetrail<\/a>\n<a class=\"petsw\" href=\"Owner-ChoosePet.html\" aria-label=\"Switch pet, current pet Snowball\"><img src=\"assets/snowball.jpg\" alt=\"\"><div style=\"flex: 1; min-width: 0\"><p class=\"b\">Snowball<\/p><p class=\"xs muted\">Switch pet<\/p><\/div><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m7 9 5-5 5 5M7 15l5 5 5-5\"><\/path><\/svg><\/a>\n<a class=\"nav\" href=\"index.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"><\/path><\/svg>Home<\/a>\n<a class=\"nav on\" href=\"Owner-Appointments.html\" aria-current=\"page\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><path d=\"M3 10h18M8 3v4M16 3v4\"><\/path><\/svg>Appointments<\/a>\n<a class=\"nav\" href=\"Owner-Messages.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"><\/path><\/svg>Messages<span class=\"cnt\">2<\/span><\/a>\n<a class=\"nav\" href=\"Owner-Records.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"><\/rect><path d=\"M9 4V3h6v1M9 10h6M9 14h4\"><\/path><\/svg>Health records<\/a>\n<a class=\"nav\" href=\"Owner-Billing.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z\"><\/path><path d=\"M9 8h6M9 12h6\"><\/path><\/svg>Billing<\/a>\n<div class=\"grow\"><\/div>\n<a class=\"nav\" href=\"Owner-Settings.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h10M18 7h2M4 17h4M12 17h8\"><\/path><circle cx=\"16\" cy=\"7\" r=\"2\"><\/circle><circle cx=\"10\" cy=\"17\" r=\"2\"><\/circle><\/svg>Settings<\/a>\n<a class=\"nav\" href=\"Owner-Login.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11\"><\/path><\/svg>Log out<\/a>\n<div class=\"me\"><span class=\"av\">JD<\/span><div><p class=\"b\">Jane Doe<\/p><p class=\"xs muted\">Los Angeles Vet Clinic<\/p><\/div><\/div>\n<\/nav>\n\n<main class=\"main\">\n<div>\n<nav class=\"crumb\" aria-label=\"Breadcrumb\"><a href=\"Owner-Appointments.html\">Appointments<\/a><span aria-hidden=\"true\">/<\/span><span style=\"color: #3F4A5A\">Schedule<\/span><\/nav>\n<h1 style=\"margin-top: 10px\">{{title}}<\/h1>\n<\/div>\n\n<sc-if value=\"{{isPick}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"wrap\">\n<div class=\"col\" style=\"flex: 2 1 540px\">\n<section class=\"card\" aria-labelledby=\"r-h\">\n<h2 id=\"r-h\">What's the visit for?<\/h2>\n<div class=\"rs\" style=\"margin-top: 14px\">\n<sc-for list=\"{{reasons}}\" as=\"r\" hint-placeholder-count=\"7\">\n<button class=\"{{r.cls}}\" type=\"button\" aria-pressed=\"{{r.pressed}}\" onClick=\"{{r.pick}}\">{{r.label}}<\/button>\n<\/sc-for>\n<\/div>\n<div class=\"fld\" style=\"margin-top: 20px\"><label for=\"nt\">Anything the vet should know? <span class=\"muted\" style=\"font-weight: 400\">Optional<\/span><\/label><textarea class=\"inp\" id=\"nt\" placeholder=\"Symptoms, questions, or changes you've noticed\"><\/textarea><\/div>\n<\/section>\n\n<section class=\"card\" aria-labelledby=\"d-h\">\n<div class=\"hd\"><h2 id=\"d-h\">Pick a day and time<\/h2>\n<div class=\"row\" style=\"gap: 6px\"><button class=\"icob\" type=\"button\" aria-label=\"Previous week\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m15 6-6 6 6 6\"><\/path><\/svg><\/button><span class=\"b\" style=\"min-width: 110px; text-align: center\">Mar 24 – 30, 2025<\/span><button class=\"icob\" type=\"button\" aria-label=\"Next week\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"><\/path><\/svg><\/button><\/div>\n<\/div>\n<div class=\"days\">\n<sc-for list=\"{{days}}\" as=\"d\" hint-placeholder-count=\"7\">\n<button class=\"{{d.cls}}\" type=\"button\" disabled=\"{{d.off}}\" aria-pressed=\"{{d.pressed}}\" onClick=\"{{d.pick}}\"><span>{{d.dow}}<\/span><b>{{d.n}}<\/b><\/button>\n<\/sc-for>\n<\/div>\n<p class=\"sm muted\" style=\"margin: 18px 0 10px\">Open times on {{dayLabel}}<\/p>\n<div class=\"slots\">\n<sc-for list=\"{{slots}}\" as=\"t\" hint-placeholder-count=\"10\">\n<button class=\"{{t.cls}}\" type=\"button\" aria-pressed=\"{{t.pressed}}\" onClick=\"{{t.pick}}\">{{t.label}}<\/button>\n<\/sc-for>\n<\/div>\n<\/section>\n<\/div>\n\n<aside class=\"card\" style=\"flex: 1 1 300px\" aria-labelledby=\"s-h\">\n<h2 id=\"s-h\">Your booking<\/h2>\n<dl style=\"margin: 10px 0 18px\">\n<div class=\"sum\"><dt>Pet<\/dt><dd>Snowball<\/dd><\/div>\n<div class=\"sum\"><dt>Reason<\/dt><dd>{{reason}}<\/dd><\/div>\n<div class=\"sum\"><dt>Date<\/dt><dd>{{dayLabel}}<\/dd><\/div>\n<div class=\"sum\"><dt>Time<\/dt><dd>{{time}}<\/dd><\/div>\n<div class=\"sum\"><dt>Vet<\/dt><dd>Dr. Sarah Davis<\/dd><\/div>\n<\/dl>\n<button class=\"btn pri full\" type=\"button\" onClick=\"{{toReview}}\">Continue<\/button>\n<p class=\"xs muted\" style=\"margin-top: 10px; text-align: center\">You can cancel up to 24 hours before.<\/p>\n<\/aside>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{isReview}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"card\" style=\"max-width: 640px; width: 100%; padding: 32px\" aria-labelledby=\"rv-h\">\n<h2 id=\"rv-h\" style=\"font-size: 20px\">Check the details<\/h2>\n<p class=\"sub\" style=\"margin-top: 4px\">We'll send this to the clinic to confirm.<\/p>\n<dl style=\"margin: 18px 0 24px\">\n<div class=\"sum\"><dt>Appointment reason<\/dt><dd>{{reason}}<\/dd><\/div>\n<div class=\"sum\"><dt>Clinic<\/dt><dd>Los Angeles Vet Clinic<br><span class=\"xs muted\" style=\"font-weight: 400\">1544 W Slauson Ave, Los Angeles, CA 90047<\/span><\/dd><\/div>\n<div class=\"sum\"><dt>Date &amp; time<\/dt><dd>{{time}}, {{dayLabel}}<\/dd><\/div>\n<div class=\"sum\"><dt>Booked for<\/dt><dd>Snowball<\/dd><\/div>\n<div class=\"sum\"><dt>Veterinarian<\/dt><dd>Dr. Sarah Davis<\/dd><\/div>\n<\/dl>\n<div class=\"row\" style=\"gap: 10px; flex-wrap: wrap\"><button class=\"btn sec\" type=\"button\" onClick=\"{{toPick}}\">Edit<\/button><button class=\"btn pri\" type=\"button\" style=\"flex: 1\" onClick=\"{{toDone}}\">Confirm appointment<\/button><\/div>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{isDone}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"card\" style=\"max-width: 640px; width: 100%; padding: 40px 32px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px\" aria-labelledby=\"dn-h\">\n<span class=\"ic ok\" style=\"width: 64px; height: 64px; border-radius: 999px\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 30px; height: 30px\"><path d=\"M20 6 9 17l-5-5\"><\/path><\/svg><\/span>\n<h2 id=\"dn-h\" style=\"font-size: 24px\">You're booked!<\/h2>\n<p class=\"sub\" style=\"max-width: 420px\">{{reason}} for Snowball on {{dayLabel}} at {{time}} with Dr. Sarah Davis. We'll remind you the day before.<\/p>\n<div class=\"row\" style=\"gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px\"><button class=\"btn sec\" type=\"button\">Add to calendar<\/button><a class=\"btn pri\" href=\"Owner-Appointments.html\">View appointments<\/a><\/div>\n<\/section>\n<\/sc-if>\n<\/main>\n<\/div>\n");
</script>
</body>
</html>
