<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vetrail clinic · Add new client</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/vetrail.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.clinic{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:10px;border-radius:16px;background:#F3F5F8}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:#5F6B7C}
.crumb a{text-decoration:none;font-weight:500}
.steps{display:flex;gap:8px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.steps li{flex:1 1 140px;display:flex;flex-direction:column;gap:8px;font-size:12px;font-weight:600;color:#5F6B7C}
.steps li span{height:4px;border-radius:999px;background:#E1E5EB}
.steps li.on{color:#0B62B5}
.steps li.on span{background:#0B62B5}
.opt{flex:1 1 300px;display:flex;flex-direction:column;gap:12px;text-align:left;background:#fff;border:1.5px solid #E8EBF0;border-radius:20px;padding:24px;cursor:pointer;font:inherit;color:inherit}
.opt:hover{border-color:#9DBDE0}
.opt.on{border-color:#0B62B5;box-shadow:0 0 0 4px #D3E5F8}
.drop.over{border-color:#0B62B5;background:#EAF2FB}
.pick{position:relative;cursor:pointer}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.file{display:flex;align-items:center;gap:14px;border:1px solid #E8EBF0;border-radius:14px;padding:14px 16px;background:#fff}
.chk{display:flex;align-items:center;gap:12px;padding:10px 0}
.chk .dt{width:26px;height:26px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:#EEF1F4;color:#5F6B7C;font-size:12px;font-weight:700}
.chk.done .dt{background:#E6F5EC;color:#12663D}
.chk.now .dt{background:#0B62B5;color:#fff}
.chk.now p{font-weight:600}
.bar{height:8px;border-radius:999px;background:#EEF1F4;overflow:hidden}
.bar span{display:block;height:100%;background:#0B62B5;border-radius:999px;transition:width .4s}
.secb{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:12px;background:transparent;font:500 14px Inter,sans-serif;color:#3F4A5A;cursor:pointer;text-align:left}
.secb:hover{background:#F3F5F8}
.secb.on{background:#EAF2FB;color:#0B62B5;font-weight:600}
.secb .n{margin-left:auto;font-size:12px;color:#5F6B7C;font-weight:500}
.flagdot{width:8px;height:8px;border-radius:999px;background:#D9661F;flex:none}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.pf{display:flex;flex-direction:column;gap:6px}
.pf .lab{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:#3F4A5A}
.src{font-size:11px;font-weight:600;color:#0A559E;background:#EAF2FB;border-radius:6px;padding:1px 6px}
.pf .inp{min-height:44px;font-size:14px}
.pf.flag .inp{border-color:#E6A26E;background:#FFFAF5}
.fl{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-start;padding:16px 18px;border-radius:14px;background:#FFF6EE;border:1px solid #F5D9C2}
.fl.ok{background:#F2FAF5;border-color:#CDE9D7}
.chipz{display:flex;flex-wrap:wrap;gap:8px}
.tl{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid #EEF1F4}
.tl:last-child{border-bottom:0}
.tl .d{width:84px;flex:none;font-size:13px;color:#5F6B7C;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/preact.min.js"></script>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 'method', mode: 'import', files: [], over: false, prog: 0, sec: 'info', email: '', rabiesOk: false, trazOk: false };
  }
  componentWillUnmount() { if (this.timer) clearInterval(this.timer); }
  startParse() {
    if (this.timer) clearInterval(this.timer);
    this.setState({ step: 'parsing', prog: 0 });
    this.timer = setInterval(() => {
      const p = (this.state.prog || 0) + 1;
      if (p >= 7) { clearInterval(this.timer); this.timer = null; this.setState({ step: 'review', prog: 7, sec: 'info' }); }
      else this.setState({ prog: p });
    }, 650);
  }
  renderVals() {
    const s = this.state || {};
    const step = s.step || 'method';
    const prog = s.prog || 0;
    const TASKS = [
      ['Reading every page', ''], ['Finding owner & pet details', 'Erica Reese · Mae'], ['Extracting vaccines & reminders', '6 vaccines'],
      ['Extracting medications', '6 found'], ['Building medical history', '8 key visits'], ['Matching fields to your PIMS', '']
    ];
    const emailOk = !!(s.email && s.email.trim());
    const open = (emailOk ? 0 : 1) + (s.rabiesOk ? 0 : 1) + (s.trazOk ? 0 : 1);
    const I = {
      info: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
      vax: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4',
      meds: 'M10.5 20.5 3.5 13.5a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7zM8.5 8.5l7 7',
      hist: 'M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2',
      rem: 'M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0'
    };
    const SECS = [
      { id: 'info', label: 'Owner & pet', n: '2', flag: !emailOk },
      { id: 'vax', label: 'Vaccines', n: '6', flag: !s.rabiesOk },
      { id: 'meds', label: 'Medications', n: '6', flag: !s.trazOk },
      { id: 'hist', label: 'Medical history', n: '8', flag: false },
      { id: 'rem', label: 'Reminders', n: '9', flag: false }
    ];
    const sec = s.sec || 'info';
    const W = [24.4, 24.4, 32, 50, 57, 65, 63.8, 68, 67.6, 68.3, 65, 65, 65, 68, 68, 68, 68, 68, 68, 68, 59.5, 65, 67.1, 67.1, 62, 61.5, 63, 63.5];
    const wpts = W.map((w, i) => (i * 300 / (W.length - 1)).toFixed(1) + ',' + (58 - (w - 20) / 52 * 54).toFixed(1)).join(' ');
    const vax = [
      ['Rabies (3-year)', '1/30/2025', '1/27/2028', 'Laurel Fisher, DVM', 'p.2', 'neu'],
      ['DHLP-PV (2-year)', '10/30/2024', '10/28/2026', 'M Slovak, DVM', 'p.24', 'neu'],
      ['Bordetella (injectable)', '10/30/2024', '10/30/2025', 'M Slovak, DVM', 'p.24', 'neu'],
      ['Leptospirosis', '10/30/2024', '10/30/2025', 'M Slovak, DVM', 'p.24', 'neu'],
      ['Canine influenza H3N2/H3N8', '10/30/2024', '10/30/2025', 'M Slovak, DVM', 'p.24', 'neu'],
      ['ProHeart 12 (heartworm)', '6/4/2024', '6/4/2025', 'M Slovak, DVM', 'p.34', 'warn']
    ].map((v) => ({ n: v[0], d: v[1], due: v[5] === 'warn' ? 'Due ' + v[2] : v[2], by: v[3], p: v[4], pc: 'pill ' + v[5] }));
    const meds = [
      ['Carprofen 75 mg', '1 tab by mouth every 12 h with food, for pain and inflammation', '1/23/2025', 'Active', 'ok', 'p.2'],
      ['Gabapentin 300 mg', '1 capsule by mouth every 12 h', '1/6/2025', 'Active', 'ok', 'p.2'],
      ['Trazodone 100 mg', s.trazOk ? 'Added by you' : 'Missing', '12/17/2024', 'Check', s.trazOk ? 'ok' : 'warn', 'p.6'],
      ['YUMOVE Advanced 360', 'Joint supplement, daily', '4/14/2025', 'Active', 'ok', 'p.2'],
      ['Simparica TRIO 44–88 lb', 'Monthly flea, tick & worm prevention', '5/9/2024', 'Lapsed', 'neu', 'p.34'],
      ['Cephalexin 500 mg', 'Post-op antibiotic course', '11/7/2024', 'Completed', 'neu', 'p.14']
    ].map((m) => ({ n: m[0], dir: m[1], d: m[2], st: m[0].indexOf('Trazodone') === 0 && s.trazOk ? 'Active' : m[3], pc: 'pill ' + m[4], p: m[5] }));
    const hist = [
      ['1/30/2025', '12-week TPLO recheck', 'Recheck', 'Walking well, full weight bearing. X-rays: plate and screws in place, osteotomy healed.', 'Laurel Fisher, DVM', 'p.2'],
      ['1/6/2025', '8-week TPLO recheck', 'Recheck', 'Adequate healing. Continue gabapentin and carprofen; recheck in 4 weeks.', 'Laurel Fisher, DVM', 'p.2'],
      ['11/7/2024', 'TPLO surgery, left stifle', 'Surgery', 'Tibial plateau leveling osteotomy under anesthesia. Laser therapy, 6 sessions after.', 'Laurel Fisher, DVM', 'p.8'],
      ['10/30/2024', 'Possible torn ACL', 'Exam', 'Sedated X-ray study. Annual vaccines given the same day.', 'Laurel Fisher, DVM', 'p.24'],
      ['6/18/2024', 'Mass removal + dental', 'Surgery', 'Mast cell tumor, low grade (Patnaik 2), complete margins. Grade 1 dental.', 'M Slovak, DVM', 'p.32'],
      ['6/4/2024', 'Wellness labs', 'Lab', 'Chemistry/CBC panel and 4DX heartworm test. ProHeart 12 given.', 'M Slovak, DVM', 'p.34'],
      ['11/6/2023', 'X-rays, 2 plates', 'Imaging', 'Carprofen 100 mg prescribed.', 'M Slovak, DVM', 'p.38'],
      ['2/8/2023', 'Sedated X-ray study', 'Imaging', 'ProHeart 12 injection. Adequan started.', 'M Slovak, DVM', 'p.42']
    ].map((h) => ({ d: h[0], t: h[1], cat: h[2], note: h[3], by: h[4], p: h[5] }));
    const rems = [
      ['Fecal examination', '2/7/2024', 'Overdue'], ['Wellness examination', '6/4/2025'], ['Heartworm test', '6/4/2025'], ['ProHeart 12 injection', '6/4/2025'],
      ['Leptospirosis vaccine', '10/30/2025'], ['Bordetella vaccine', '10/30/2025'], ['CIV influenza H3N2/H3N8', '10/30/2025'], ['DHP-PV', '10/28/2026'], ['Rabies vaccine', '1/27/2028']
    ].map((r) => ({ n: r[0], due: r[2] ? r[2] + ' · ' + r[1] : r[1], pc: r[2] ? 'pill warn' : 'pill neu' }));
    const files = s.files || [];
    const fmtSize = (b) => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round((b || 0) / 1024)) + ' KB';
    const addReal = (list) => {
      const arr = Array.prototype.slice.call(list || []).map((f) => ({ name: f.name, meta: fmtSize(f.size) + ' · ready to parse' }));
      this.setState({ files: files.concat(arr), over: false });
    };
    const order = { method: 1, manual: 1, upload: 2, parsing: 2, review: 3, done: 4 };
    const o = order[step] || 1;
    const mode = s.mode || 'import';
    return {
      title: step === 'done' ? 'Client added' : step === 'review' ? 'Review parsed records' : 'Add new client',
      st1: o >= 1 ? 'on' : '', st2: o >= 2 ? 'on' : '', st3: o >= 3 ? 'on' : '', st4: o >= 4 ? 'on' : '',
      isMethod: step === 'method', isUpload: step === 'upload', isParsing: step === 'parsing', isReview: step === 'review', isManual: step === 'manual', isDone: step === 'done',
      optImport: mode === 'import' ? 'opt on' : 'opt', optManual: mode === 'manual' ? 'opt on' : 'opt',
      pImport: mode === 'import' ? 'true' : 'false', pManual: mode === 'manual' ? 'true' : 'false',
      pickImport: () => this.setState({ mode: 'import' }), pickManual: () => this.setState({ mode: 'manual' }),
      next1: () => this.setState({ step: mode === 'manual' ? 'manual' : 'upload' }),
      back1: () => this.setState({ step: 'method' }),
      back2: () => this.setState({ step: 'upload' }),
      files: files.map((f, i) => ({ ...f, remove: () => this.setState({ files: files.filter((x, j) => j !== i) }) })),
      noFile: !files.length, parseOpacity: files.length ? '1' : '.5',
      dropCls: s.over ? 'drop over' : 'drop',
      onPick: (e) => { addReal(e && e.target && e.target.files); if (e && e.target) e.target.value = ''; },
      onDragOver: (e) => { if (e && e.preventDefault) e.preventDefault(); if (!s.over) this.setState({ over: true }); },
      onDragLeave: () => this.setState({ over: false }),
      onDrop: (e) => { if (e && e.preventDefault) e.preventDefault(); addReal(e && e.dataTransfer && e.dataTransfer.files); },
      addSample: () => { if (!files.some((f) => f.sample)) this.setState({ files: files.concat([{ name: 'vetInfoPulse.pdf', meta: '55 pages · 2.5 MB · High Point Animal Hospital detected', sample: true }]) }); },
      fileName: files.length > 1 ? files.length + ' files' : (files[0] ? files[0].name : 'records'),
      fileMeta: files.length > 1 ? files.map((f) => f.name).join(', ') : (files[0] ? files[0].meta.split(' · ')[0] : ''),
      startParse: () => this.startParse(),
      pct: Math.round(Math.min(prog, 6) / 6 * 100), pctW: Math.round(Math.min(prog, 6) / 6 * 100) + '%',
      tasks: TASKS.map((t, i) => ({ label: t[0], meta: i < prog ? t[1] : '', mark: i < prog ? '✓' : String(i + 1), cls: i < prog ? 'chk done' : i === prog ? 'chk now' : 'chk' })),
      flagText: open ? open + ' item' + (open > 1 ? 's' : '') + ' need a look' : 'All checked',
      flagBg: open ? '#FFF0E3' : '#E6F5EC', flagFg: open ? '#9C430B' : '#12663D',
      secs: SECS.map((x) => ({ ...x, icon: I[x.id], cls: x.id === sec ? 'secb on' : 'secb', pick: () => this.setState({ sec: x.id }) })),
      secInfo: sec === 'info', secVax: sec === 'vax', secMeds: sec === 'meds', secHist: sec === 'hist', secRem: sec === 'rem',
      emailCls: emailOk ? 'pf' : 'pf flag', emailTag: emailOk ? 'Added' : 'Not in records', emailVal: s.email || '',
      onEmail: (e) => this.setState({ email: e && e.target ? e.target.value : '' }),
      rabiesOpen: !s.rabiesOk, okRabies: () => this.setState({ rabiesOk: true }),
      trazOpen: !s.trazOk, okTraz: () => this.setState({ trazOk: true }),
      wpts, vax, meds, hist, rems,
      saveHint: open ? open + ' unchecked item' + (open > 1 ? 's' : '') + ' will be marked for follow-up' : 'Everything checked',
      save: () => this.setState({ step: 'done' }),
      restart: () => this.setState({ step: 'method', prog: 0, sec: 'info', email: '', rabiesOk: false, trazOk: false, files: [] })
    };
  }
}
DCLite.mount(Component, "\n\n<div class=\"app\">\n<nav class=\"side\" aria-label=\"Clinic navigation\">\n<a class=\"brand\" href=\"Clinic-Clients.html\"><img src=\"assets/logo.png\" alt=\"\">Vetrail<\/a>\n<div class=\"clinic\"><span class=\"ic\" style=\"background: #073B66; color: #fff; font: 600 13px Outfit, sans-serif\">LA<\/span><div style=\"min-width: 0\"><p class=\"b\">Los Angeles Vet Clinic<\/p><p class=\"xs muted\">Clinic portal<\/p><\/div><\/div>\n<a class=\"nav on\" href=\"Clinic-Clients.html\" aria-current=\"page\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"><\/circle><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5.5 5.5 0 0 1 3.5 6\"><\/path><\/svg>Clients<\/a>\n<a class=\"nav\" href=\"Clinic-Calendar.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><path d=\"M3 10h18M8 3v4M16 3v4\"><\/path><\/svg>Calendar<\/a>\n<a class=\"nav\" href=\"Clinic-Messages.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"><\/path><\/svg>Messages<span class=\"cnt\">3<\/span><\/a>\n<a class=\"nav\" href=\"Clinic-Upload.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 15V3M7 8l5-5 5 5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2\"><\/path><\/svg>Upload results<\/a>\n<div class=\"grow\"><\/div>\n<a class=\"nav\" href=\"#\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h10M18 7h2M4 17h4M12 17h8\"><\/path><circle cx=\"16\" cy=\"7\" r=\"2\"><\/circle><circle cx=\"10\" cy=\"17\" r=\"2\"><\/circle><\/svg>Settings<\/a>\n<a class=\"nav\" href=\"Owner-Login.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11\"><\/path><\/svg>Log out<\/a>\n<div class=\"me\"><span class=\"av\">SD<\/span><div><p class=\"b\">Dr. Sarah Davis<\/p><p class=\"xs muted\">Veterinarian<\/p><\/div><\/div>\n<\/nav>\n\n<main class=\"main\">\n<div>\n<nav class=\"crumb\" aria-label=\"Breadcrumb\"><a href=\"Clinic-Clients.html\">Clients<\/a><span aria-hidden=\"true\">/<\/span><span style=\"color: #3F4A5A\">Add new client<\/span><\/nav>\n<div class=\"top\" style=\"margin-top: 10px\">\n<h1>{{title}}<\/h1>\n<a class=\"btn ghost sm\" href=\"Clinic-Clients.html\">Cancel<\/a>\n<\/div>\n<\/div>\n\n<ol class=\"steps\" aria-label=\"Progress\">\n<li class=\"{{st1}}\"><span><\/span>How to add<\/li>\n<li class=\"{{st2}}\"><span><\/span>Upload records<\/li>\n<li class=\"{{st3}}\"><span><\/span>Review parsed data<\/li>\n<li class=\"{{st4}}\"><span><\/span>Done<\/li>\n<\/ol>\n\n<sc-if value=\"{{isMethod}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<p class=\"sub\" style=\"font-size: 15px\">Is this pet coming from another clinic? Upload their old records and Vetrail fills everything in for you.<\/p>\n<div class=\"wrap\" style=\"align-items: stretch\">\n<button class=\"{{optImport}}\" type=\"button\" aria-pressed=\"{{pImport}}\" onClick=\"{{pickImport}}\">\n<div class=\"row\" style=\"justify-content: space-between; width: 100%\"><span class=\"ic info\" style=\"width: 48px; height: 48px; border-radius: 14px\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"><\/path><path d=\"M14 3v6h6M9 15l2 2 4-4\"><\/path><\/svg><\/span><span class=\"pill ai\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z\"><\/path><\/svg>Recommended<\/span><\/div>\n<h2>Import from previous clinic<\/h2>\n<p class=\"sub\">Upload the records the client brought (PDF, scans or a PIMS export). We pull out the owner and pet details, vaccines, medications and history.<\/p>\n<p class=\"sm muted row\" style=\"gap: 6px\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 7v5l3 2\"><\/path><\/svg>About 2 minutes for a 50-page file<\/p>\n<\/button>\n<button class=\"{{optManual}}\" type=\"button\" aria-pressed=\"{{pManual}}\" onClick=\"{{pickManual}}\">\n<span class=\"ic neu\" style=\"width: 48px; height: 48px; border-radius: 14px\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 20h4L19 9l-4-4L4 16zM14 6l4 4\"><\/path><\/svg><\/span>\n<h2>Start from scratch<\/h2>\n<p class=\"sub\">For a new pet with no history yet, like a new puppy or kitten. You can still import records later.<\/p>\n<p class=\"sm muted row\" style=\"gap: 6px\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 7v5l3 2\"><\/path><\/svg>Basic details only<\/p>\n<\/button>\n<\/div>\n<div class=\"row\" style=\"justify-content: flex-end\"><button class=\"btn pri\" type=\"button\" onClick=\"{{next1}}\">Continue<\/button><\/div>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{isUpload}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"wrap\">\n<section class=\"card\" style=\"flex: 2 1 520px; display: flex; flex-direction: column; gap: 18px\" aria-labelledby=\"up-h\">\n<div><h2 id=\"up-h\">Upload previous records<\/h2><p class=\"sm sub\" style=\"margin-top: 4px\">Add everything you have. Several files are fine; we combine them into one history.<\/p><\/div>\n<div class=\"{{dropCls}}\" style=\"padding: 36px 20px\" onDragOver=\"{{onDragOver}}\" onDragLeave=\"{{onDragLeave}}\" onDrop=\"{{onDrop}}\">\n<span class=\"ic info\" style=\"border-radius: 999px; width: 52px; height: 52px\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 15V3M7 8l5-5 5 5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2\"><\/path><\/svg><\/span>\n<p class=\"b\" style=\"font-size: 15px\">Drag &amp; drop records here<\/p>\n<p class=\"xs muted\">PDF, JPG/PNG scans, or PIMS export (XML, CSV) · up to 100 MB<\/p>\n<div class=\"row\" style=\"gap: 8px; flex-wrap: wrap; justify-content: center\"><label class=\"btn sec sm pick\">Browse files<input type=\"file\" multiple accept=\".pdf,.jpg,.jpeg,.png,.xml,.csv\" onChange=\"{{onPick}}\"><\/label><button class=\"btn ghost sm\" type=\"button\" onClick=\"{{addSample}}\">Use sample record<\/button><\/div>\n<\/div>\n<sc-for list=\"{{files}}\" as=\"f\" hint-placeholder-count=\"1\">\n<div class=\"file\">\n<span class=\"ic\" style=\"background: #FDECEC; color: #B42318; border-radius: 10px\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"><\/path><path d=\"M14 3v6h6\"><\/path><\/svg><\/span>\n<div style=\"flex: 1; min-width: 0\"><p class=\"b\" style=\"overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{f.name}}<\/p><p class=\"xs muted\">{{f.meta}}<\/p><\/div>\n<span class=\"pill ok\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\/path><\/svg>Ready<\/span>\n<button class=\"icob\" type=\"button\" aria-label=\"Remove {{f.name}}\" style=\"border: 0; width: 36px; height: 36px\" onClick=\"{{f.remove}}\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6 6 18\"><\/path><\/svg><\/button>\n<\/div>\n<\/sc-for>\n<div class=\"row\" style=\"justify-content: space-between; flex-wrap: wrap; gap: 10px\">\n<button class=\"btn ghost\" type=\"button\" onClick=\"{{back1}}\">Back<\/button>\n<button class=\"btn pri\" type=\"button\" onClick=\"{{startParse}}\" disabled=\"{{noFile}}\" style=\"opacity: {{parseOpacity}}\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z\"><\/path><\/svg>Parse records<\/button>\n<\/div>\n<\/section>\n\n<aside style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 16px; min-width: 0\">\n<section class=\"card\" aria-labelledby=\"wh-h\">\n<h3 id=\"wh-h\">What we pull out<\/h3>\n<div class=\"chipz\" style=\"margin-top: 12px\">\n<span class=\"pill neu\">Owner contact<\/span><span class=\"pill neu\">Pet profile<\/span><span class=\"pill neu\">Vaccines<\/span><span class=\"pill neu\">Medications<\/span><span class=\"pill neu\">Visits &amp; procedures<\/span><span class=\"pill neu\">Lab results<\/span><span class=\"pill neu\">Weight history<\/span><span class=\"pill neu\">Reminders<\/span>\n<\/div>\n<p class=\"xs muted\" style=\"margin-top: 12px\">Nothing is saved to your PIMS until you review it.<\/p>\n<\/section>\n<section class=\"card\" aria-labelledby=\"nr-h\">\n<h3 id=\"nr-h\">No records on hand?<\/h3>\n<p class=\"sm sub\" style=\"margin-top: 4px\">We can email the previous clinic a records request on the client's behalf.<\/p>\n<button class=\"btn sec sm\" type=\"button\" style=\"margin-top: 12px\">Request records<\/button>\n<\/section>\n<\/aside>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{isParsing}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"card\" style=\"max-width: 640px; width: 100%; padding: 32px; display: flex; flex-direction: column; gap: 18px\" aria-live=\"polite\" aria-labelledby=\"pa-h\">\n<div class=\"row\"><span class=\"ic ai\" style=\"width: 48px; height: 48px; border-radius: 14px\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z\"><\/path><\/svg><\/span><div><h2 id=\"pa-h\" style=\"overflow-wrap: anywhere\">Reading {{fileName}}<\/h2><p class=\"sm muted\">{{fileMeta}} · {{pct}}% done<\/p><\/div><\/div>\n<div class=\"bar\" role=\"progressbar\" aria-valuenow=\"{{pct}}\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-label=\"Parsing progress\"><span style=\"width: {{pctW}}\"><\/span><\/div>\n<div>\n<sc-for list=\"{{tasks}}\" as=\"t\" hint-placeholder-count=\"6\">\n<div class=\"{{t.cls}}\"><span class=\"dt\">{{t.mark}}<\/span><p>{{t.label}}<\/p><span class=\"xs muted\" style=\"margin-left: auto\">{{t.meta}}<\/span><\/div>\n<\/sc-for>\n<\/div>\n<p class=\"xs muted\">You can leave this page. We'll notify you when it's ready to review.<\/p>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{isReview}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<section class=\"card row\" style=\"flex-wrap: wrap; gap: 18px; background: #073B66; border-color: #073B66; color: #fff\" aria-label=\"Parse summary\">\n<span class=\"ic\" style=\"background: rgba(255,255,255,.12); color: #6BE0F8; width: 48px; height: 48px; border-radius: 14px\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\/path><\/svg><\/span>\n<div style=\"flex: 1 1 320px\"><h2 style=\"color: #fff\">55 pages parsed from High Point Animal Hospital<\/h2><p class=\"sm\" style=\"color: #BFD3E6; margin-top: 2px\">6 vaccines, 6 medications, 8 key visits and 26 weight entries found. Saves about 3 hours of typing.<\/p><\/div>\n<span class=\"pill\" style=\"background: {{flagBg}}; color: {{flagFg}}\">{{flagText}}<\/span>\n<\/section>\n\n<div class=\"wrap\">\n<nav class=\"card\" style=\"flex: 0 1 250px; padding: 12px\" aria-label=\"Parsed sections\">\n<sc-for list=\"{{secs}}\" as=\"s\" hint-placeholder-count=\"5\">\n<button class=\"{{s.cls}}\" type=\"button\" onClick=\"{{s.pick}}\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"{{s.icon}}\"><\/path><\/svg>{{s.label}}<sc-if value=\"{{s.flag}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"flagdot\" aria-label=\"Needs a look\"><\/span><\/sc-if><span class=\"n\">{{s.n}}<\/span><\/button>\n<\/sc-for>\n<\/nav>\n\n<div class=\"col\" style=\"flex: 1 1 560px\">\n<sc-if value=\"{{secInfo}}\" hint-placeholder-val=\"{{ true }}\">\n<section class=\"card\" aria-labelledby=\"ow-h\">\n<div class=\"hd\"><h2 id=\"ow-h\">Owner<\/h2><span class=\"xs muted\">From page 1 and 4<\/span><\/div>\n<div class=\"g2\">\n<div class=\"pf\"><div class=\"lab\"><label for=\"o1\">First name<\/label><span class=\"src\">p.1<\/span><\/div><input class=\"inp\" id=\"o1\" value=\"Erica\"><\/div>\n<div class=\"pf\"><div class=\"lab\"><label for=\"o2\">Last name<\/label><span class=\"src\">p.1<\/span><\/div><input class=\"inp\" id=\"o2\" value=\"Reese\"><\/div>\n<div class=\"pf\"><div class=\"lab\"><label for=\"o3\">Phone<\/label><span class=\"src\">p.1<\/span><\/div><input class=\"inp\" id=\"o3\" value=\"(419) 351-0609\"><\/div>\n<div class=\"{{emailCls}}\"><div class=\"lab\"><label for=\"o4\">Email<\/label><span class=\"pill warn\" style=\"padding: 0 8px\">{{emailTag}}<\/span><\/div><input class=\"inp\" id=\"o4\" placeholder=\"Ask the client\" value=\"{{emailVal}}\" onChange=\"{{onEmail}}\"><\/div>\n<div class=\"pf\" style=\"grid-column: 1 / -1\"><div class=\"lab\"><label for=\"o5\">Address<\/label><span class=\"src\">p.1<\/span><\/div><input class=\"inp\" id=\"o5\" value=\"770 Village Pkwy, Waterville, OH 43566\"><\/div>\n<\/div>\n<\/section>\n<section class=\"card\" aria-labelledby=\"pt-h\">\n<div class=\"hd\"><h2 id=\"pt-h\">Pet<\/h2><span class=\"xs muted\">From page 1<\/span><\/div>\n<div class=\"row\" style=\"gap: 16px; margin-bottom: 16px; flex-wrap: wrap\">\n<span class=\"ic\" style=\"width: 64px; height: 64px; border-radius: 18px; background: #FFE6CC; color: #7A3E00; font: 600 24px Outfit, sans-serif\">M<\/span>\n<div style=\"flex: 1 1 200px\"><h3 style=\"font-size: 18px\">Mae<\/h3><p class=\"sm muted\">Golden Retriever · 7 years 7 months · previous ID 5063-L<\/p><\/div>\n<div class=\"chipz\"><span class=\"pill warn\">Post-op TPLO, left stifle<\/span><span class=\"pill neu\">MCT removed 2024<\/span><\/div>\n<\/div>\n<div class=\"g2\">\n<div class=\"pf\"><div class=\"lab\"><label for=\"p1\">Name<\/label><span class=\"src\">p.1<\/span><\/div><input class=\"inp\" id=\"p1\" value=\"Mae\"><\/div>\n<div class=\"pf\"><div class=\"lab\"><label for=\"p2\">Species<\/label><span class=\"src\">p.1<\/span><\/div><select class=\"inp\" id=\"p2\"><option>Canine<\/option><option>Feline<\/option><\/select><\/div>\n<div class=\"pf\"><div class=\"lab\"><label for=\"p3\">Breed<\/label><span class=\"src\">p.1<\/span><\/div><input class=\"inp\" id=\"p3\" value=\"Golden Retriever\"><\/div>\n<div class=\"pf\"><div class=\"lab\"><label for=\"p4\">Sex<\/label><span class=\"src\">p.1<\/span><\/div><select class=\"inp\" id=\"p4\"><option>Female, spayed<\/option><option>Female<\/option><option>Male, neutered<\/option><option>Male<\/option><\/select><\/div>\n<div class=\"pf\"><div class=\"lab\"><label for=\"p5\">Date of birth<\/label><span class=\"src\">p.1<\/span><\/div><input class=\"inp\" id=\"p5\" value=\"09/20/2017\"><\/div>\n<div class=\"pf\"><div class=\"lab\"><label for=\"p6\">Color<\/label><span class=\"src\">p.1<\/span><\/div><input class=\"inp\" id=\"p6\" value=\"Gold\"><\/div>\n<div class=\"pf\"><div class=\"lab\"><label for=\"p7\">Weight<\/label><span class=\"src\">p.1<\/span><\/div><input class=\"inp\" id=\"p7\" value=\"63.5 lb (Jan 30, 2025)\"><\/div>\n<div class=\"pf\"><div class=\"lab\"><label for=\"p8\">Microchip<\/label><span class=\"src\">p.1<\/span><\/div><input class=\"inp\" id=\"p8\" value=\"None on file\"><\/div>\n<\/div>\n<div style=\"margin-top: 18px; background: #F7F9FC; border-radius: 14px; padding: 14px 16px\">\n<div class=\"row\" style=\"justify-content: space-between\"><p class=\"sm b\">Weight history<\/p><p class=\"xs muted\">26 entries · 2018 – 2025 · p.1<\/p><\/div>\n<svg viewBox=\"0 0 300 60\" preserveAspectRatio=\"none\" style=\"width: 100%; height: 60px; margin-top: 6px\" role=\"img\" aria-label=\"Weight rose from 24 lb in 2018 to about 68 lb, now 63.5 lb\"><polyline points=\"{{wpts}}\" fill=\"none\" stroke=\"#0B62B5\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\" vector-effect=\"non-scaling-stroke\"><\/polyline><\/svg>\n<\/div>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{secVax}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"card\" aria-labelledby=\"vx-h\">\n<div class=\"hd\"><h2 id=\"vx-h\">Vaccines<\/h2><span class=\"xs muted\">Newest record kept for each vaccine<\/span><\/div>\n<sc-if value=\"{{rabiesOpen}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"fl\" style=\"margin-bottom: 14px\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"color: #9C430B\"><path d=\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01\"><\/path><\/svg><div style=\"flex: 1 1 320px; min-width: 0\"><p class=\"b\">Two rabies records found<\/p><p class=\"sm sub\">The certificate on p.4 (given 2/10/2022, expired 2/9/2025) is older than the 3-year dose on p.2 (given 1/30/2025). We'll keep the newer one.<\/p><\/div><button class=\"btn sec sm\" type=\"button\" onClick=\"{{okRabies}}\">Looks right<\/button><\/div>\n<\/sc-if>\n<div class=\"scroll\"><table class=\"tbl\" style=\"min-width: 620px\">\n<thead><tr><th scope=\"col\">Vaccine<\/th><th scope=\"col\">Last given<\/th><th scope=\"col\">Next due<\/th><th scope=\"col\">Given by<\/th><th scope=\"col\">Source<\/th><\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{vax}}\" as=\"v\" hint-placeholder-count=\"6\">\n<tr><td class=\"b\">{{v.n}}<\/td><td class=\"muted\">{{v.d}}<\/td><td><span class=\"{{v.pc}}\">{{v.due}}<\/span><\/td><td>{{v.by}}<\/td><td><span class=\"src\">{{v.p}}<\/span><\/td><\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{secMeds}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"card\" aria-labelledby=\"md-h\">\n<div class=\"hd\"><h2 id=\"md-h\">Medications<\/h2><span class=\"xs muted\">From prescriptions and inventory items<\/span><\/div>\n<sc-if value=\"{{trazOpen}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"fl\" style=\"margin-bottom: 14px\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"color: #9C430B\"><path d=\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01\"><\/path><\/svg><div style=\"flex: 1 1 320px; min-width: 0\"><p class=\"b\">Trazodone 100 mg has no dosing instructions<\/p><p class=\"sm sub\">Filled 4 times (p.6, p.14) but directions weren't printed. Add them, or confirm with the client.<\/p><label class=\"sr\" for=\"tz\">Trazodone directions<\/label><input class=\"inp\" id=\"tz\" placeholder=\"e.g. 1 tablet by mouth as needed for anxiety\" style=\"margin-top: 10px; min-height: 40px; font-size: 14px; width: 100%\"><\/div><button class=\"btn sec sm\" type=\"button\" style=\"align-self: flex-end\" onClick=\"{{okTraz}}\">Save<\/button><\/div>\n<\/sc-if>\n<div class=\"scroll\"><table class=\"tbl\" style=\"min-width: 640px\">\n<thead><tr><th scope=\"col\">Medication<\/th><th scope=\"col\">Directions<\/th><th scope=\"col\">Last filled<\/th><th scope=\"col\">Status<\/th><th scope=\"col\">Source<\/th><\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{meds}}\" as=\"m\" hint-placeholder-count=\"6\">\n<tr><td class=\"b\">{{m.n}}<\/td><td class=\"sub\" style=\"max-width: 280px\">{{m.dir}}<\/td><td class=\"muted\">{{m.d}}<\/td><td><span class=\"{{m.pc}}\">{{m.st}}<\/span><\/td><td><span class=\"src\">{{m.p}}<\/span><\/td><\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{secHist}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"card\" aria-labelledby=\"hs-h\">\n<div class=\"hd\"><h2 id=\"hs-h\">Medical history<\/h2><span class=\"xs muted\">Key visits · full chart attached as PDF<\/span><\/div>\n<div class=\"chipz\" style=\"margin-bottom: 8px\"><span class=\"pill warn\">Problem: CCL tear, left (TPLO 11/2024)<\/span><span class=\"pill neu\">Mast cell tumor, low grade, clean margins<\/span><\/div>\n<sc-for list=\"{{hist}}\" as=\"h\" hint-placeholder-count=\"8\">\n<div class=\"tl\"><span class=\"d\">{{h.d}}<\/span><div style=\"flex: 1; min-width: 0\"><div class=\"row\" style=\"gap: 8px; flex-wrap: wrap\"><h3>{{h.t}}<\/h3><span class=\"pill neu\">{{h.cat}}<\/span><\/div><p class=\"sm sub\" style=\"margin-top: 4px\">{{h.note}}<\/p><p class=
