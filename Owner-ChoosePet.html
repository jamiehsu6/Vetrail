<style>
body{margin:0}
.pg{min-height:100vh;background:#F3F5F8;font-family:Inter,system-ui,sans-serif;color:#0F1B2A;font-size:14px;line-height:1.5;padding:32px 24px 64px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center}
