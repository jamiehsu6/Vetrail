<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vetrail · Messages</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/vetrail.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.box{display:flex;flex-wrap:wrap;background:#fff;border:1px solid #E8EBF0;border-radius:20px;overflow:hidden;min-height:680px}
.lst{flex:1 1 300px;border-right:1px solid #E8EBF0;display:flex;flex-direction:column;min-width:0}
.th{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #EEF1F4;padding:16px 20px;cursor:pointer;font:inherit;color:inherit}
.th:hover{background:#FAFBFD}
.th.on{background:#EAF2FB}
.conv{flex:2 1 460px;display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;padding:24px;display:flex;flex-direction:column;gap:18px;background:#FAFBFC}
.bub{max-width:520px;padding:14px 16px;border-radius:18px;line-height:1.55}
.them .bub{background:#fff;border:1px solid #E8EBF0;border-top-left-radius:6px}
.mine{align-self:flex-end;align-items:flex-end}
.mine .bub{background:#0B62B5;color:#fff;border-top-right-radius:6px}
.mrow{display:flex;flex-direction:column;gap:6px}
.cmp{display:flex;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid #E8EBF0}
.mw{position:fixed;right:32px;bottom:0;width:min(560px,calc(100vw - 32px));background:#fff;border-radius:16px 16px 0 0;box-shadow:0 12px 48px rgba(15,27,42,.28),0 0 0 1px rgba(15,27,42,.06);z-index:50;display:flex;flex-direction:column;font-family:Inter,system-ui,sans-serif}
.mwh{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 20px;background:#073B66;color:#fff;border-radius:16px 16px 0 0}
.mwh h2{color:#fff;font-size:15px;flex:1}
.mwb{border:0;background:transparent;color:#fff;width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.mwb:hover{background:rgba(255,255,255,.14)}
.mwr{display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid #EEF1F4;min-height:48px}
.mwr label{font-size:13px;color:#5F6B7C;width:56px;flex:none}
.mwr select,.mwr input{flex:1;min-width:0;border:0;outline:0;font:14px Inter,sans-serif;color:#0F1B2A;background:transparent;min-height:46px}
.mwt{border:0;outline:0;resize:none;font:15px/1.55 Inter,sans-serif;color:#0F1B2A;padding:16px 20px;min-height:220px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0F1B2A;color:#fff;border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:10px;font:500 14px Inter,sans-serif;z-index:60;box-shadow:0 8px 24px rgba(15,27,42,.25)}
.cmp input{flex:1;min-width:0;border:0;outline:0;font:inherit;background:#F3F5F8;border-radius:12px;min-height:44px;padding:0 14px}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/preact.min.js"></script>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'ear', compose: false, min: false, sent: false }; }
  renderVals() {
    const s = this.state || {};
    const T = [
      { id: 'ear', subject: 'Potential ear infection', from: 'Los Angeles Vet Clinic', ini: 'LA', bg: '#073B66', fg: '#fff', when: '8:04 AM', unread: true,
        msgs: [
          { me: true, who: 'You', time: 'Today 7:41 AM', text: "I've noticed some concerning symptoms with Snowball that might indicate an ear infection. He has been scratching his ear frequently, shaking his head, and there's a noticeable odor coming from the ear. Please let me know what you recommend." },
          { me: false, who: 'Los Angeles Vet Clinic', time: 'Today 8:04 AM', text: 'Yes, this looks like an ear infection. Please schedule an appointment through the portal as soon as possible.' }
        ] },
      { id: 'lab', subject: 'Lab results question', from: 'Dr. Sarah Davis', ini: 'SD', bg: '#CFEFFD', fg: '#0A4F78', when: 'Mar 12', unread: true,
        msgs: [
          { me: false, who: 'Dr. Sarah Davis', time: 'Mar 12, 4:15 PM', text: "Snowball's lab results are ready! I added a plain-language summary. Please let me know if you have any questions." },
          { me: true, who: 'You', time: 'Mar 12, 5:02 PM', text: 'Thank you so much! Should I be worried about the BUN value?' }
        ] },
      { id: 'med', subject: 'Medication refill', from: 'Front desk', ini: 'FD', bg: '#FCE3F2', fg: '#8A1F63', when: 'Mar 20', unread: false,
        msgs: [
          { me: true, who: 'You', time: 'Mar 20, 9:10 AM', text: "Could we refill Snowball's Apoquel? We have about five days left." },
          { me: false, who: 'Front desk', time: 'Mar 20, 11:32 AM', text: 'Done! The refill is ready for pickup after 2 PM today.' }
        ] },
      { id: 'vax', subject: 'Vaccine reminder', from: 'Los Angeles Vet Clinic', ini: 'LA', bg: '#E6E0FF', fg: '#4B2FA8', when: 'Mar 18', unread: false,
        msgs: [
          { me: false, who: 'Los Angeles Vet Clinic', time: 'Mar 18, 10:00 AM', text: "Snowball's Bordetella booster is due in June. You can add it to his March 31 check-up if that's easier." }
        ] }
    ];
    const cur = T.find((t) => t.id === s.sel) || T[0];
    const prev = (t) => t.msgs[t.msgs.length - 1].text;
    return {
      isThread: true, isNew: !!s.compose, isOpenBody: !s.min, sent: !!s.sent,
      minLabel: s.min ? 'Expand' : 'Minimize', minIcon: s.min ? 'm6 15 6-6 6 6' : 'M5 12h14',
      toggleMin: () => this.setState({ min: !s.min }),
      newMsg: () => this.setState({ compose: true, min: false, sent: false }),
      closeNew: () => this.setState({ compose: false, min: false }),
      send: () => this.setState({ compose: false, min: false, sent: true }),
      hideToast: () => this.setState({ sent: false }),
      threads: T.map((t) => ({ ...t, preview: prev(t), cls: t.id === cur.id ? 'th on' : 'th', pick: () => this.setState({ sel: t.id }) })),
      cur: { ...cur, msgs: cur.msgs.map((m) => ({ ...m, cls: m.me ? 'mrow mine' : 'mrow them' })) }
    };
  }
}
DCLite.mount(Component, "\n\n<div class=\"app\">\n<nav class=\"side\" aria-label=\"Main navigation\">\n<a class=\"brand\" href=\"index.html\"><img src=\"assets/logo.png\" alt=\"\">Vetrail<\/a>\n<a class=\"petsw\" href=\"Owner-ChoosePet.html\" aria-label=\"Switch pet, current pet Snowball\"><img src=\"assets/snowball.jpg\" alt=\"\"><div style=\"flex: 1; min-width: 0\"><p class=\"b\">Snowball<\/p><p class=\"xs muted\">Switch pet<\/p><\/div><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m7 9 5-5 5 5M7 15l5 5 5-5\"><\/path><\/svg><\/a>\n<a class=\"nav\" href=\"index.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"><\/path><\/svg>Home<\/a>\n<a class=\"nav\" href=\"Owner-Appointments.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><path d=\"M3 10h18M8 3v4M16 3v4\"><\/path><\/svg>Appointments<\/a>\n<a class=\"nav on\" href=\"Owner-Messages.html\" aria-current=\"page\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"><\/path><\/svg>Messages<span class=\"cnt\">2<\/span><\/a>\n<a class=\"nav\" href=\"Owner-Records.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"><\/rect><path d=\"M9 4V3h6v1M9 10h6M9 14h4\"><\/path><\/svg>Health records<\/a>\n<a class=\"nav\" href=\"Owner-Billing.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z\"><\/path><path d=\"M9 8h6M9 12h6\"><\/path><\/svg>Billing<\/a>\n<div class=\"grow\"><\/div>\n<a class=\"nav\" href=\"Owner-Settings.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h10M18 7h2M4 17h4M12 17h8\"><\/path><circle cx=\"16\" cy=\"7\" r=\"2\"><\/circle><circle cx=\"10\" cy=\"17\" r=\"2\"><\/circle><\/svg>Settings<\/a>\n<a class=\"nav\" href=\"Owner-Login.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11\"><\/path><\/svg>Log out<\/a>\n<div class=\"me\"><span class=\"av\">JD<\/span><div><p class=\"b\">Jane Doe<\/p><p class=\"xs muted\">Los Angeles Vet Clinic<\/p><\/div><\/div>\n<\/nav>\n\n<main class=\"main\">\n<div class=\"top\">\n<div><h1>Messages<\/h1><p class=\"sub\" style=\"margin-top: 4px\">Your clinic usually replies within a few hours.<\/p><\/div>\n<button class=\"btn pri\" type=\"button\" onClick=\"{{newMsg}}\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 20h4L19 9l-4-4L4 16zM14 6l4 4\"><\/path><\/svg>New message<\/button>\n<\/div>\n\n<div class=\"box\">\n<div class=\"lst\">\n<div style=\"padding: 16px 20px; border-bottom: 1px solid #EEF1F4\"><label class=\"search\" style=\"flex: none; width: 100%\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"m20 20-3.5-3.5\"><\/path><\/svg><span class=\"sr\">Search messages<\/span><input type=\"search\" placeholder=\"Search messages\"><\/label><\/div>\n<sc-for list=\"{{threads}}\" as=\"t\" hint-placeholder-count=\"4\">\n<button class=\"{{t.cls}}\" type=\"button\" onClick=\"{{t.pick}}\">\n<span class=\"av\" style=\"background: {{t.bg}}; color: {{t.fg}}\">{{t.ini}}<\/span>\n<span style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px\">\n<span class=\"row\" style=\"justify-content: space-between; gap: 8px\"><span class=\"b\" style=\"white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{t.subject}}<\/span><span class=\"xs muted\" style=\"white-space: nowrap\">{{t.when}}<\/span><\/span>\n<span class=\"sm muted\">{{t.from}}<\/span>\n<span class=\"sm\" style=\"color: #3F4A5A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{t.preview}}<\/span>\n<\/span>\n<sc-if value=\"{{t.unread}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"sd\" style=\"background: #0B62B5; margin-top: 6px\" aria-label=\"Unread\"><\/span><\/sc-if>\n<\/button>\n<\/sc-for>\n<\/div>\n\n<sc-if value=\"{{isThread}}\" hint-placeholder-val=\"{{ true }}\">\n<section class=\"conv\" aria-labelledby=\"cv-h\">\n<div class=\"top\" style=\"padding: 18px 24px; border-bottom: 1px solid #E8EBF0\">\n<div><h2 id=\"cv-h\">{{cur.subject}}<\/h2><p class=\"sm muted\">{{cur.from}} · about Snowball<\/p><\/div>\n<a class=\"btn sec sm\" href=\"Owner-Book.html\">Book appointment<\/a>\n<\/div>\n<div class=\"msgs\">\n<sc-for list=\"{{cur.msgs}}\" as=\"m\" hint-placeholder-count=\"2\">\n<div class=\"{{m.cls}}\">\n<div class=\"row\" style=\"gap: 8px\"><span class=\"xs b\">{{m.who}}<\/span><span class=\"xs muted\">{{m.time}}<\/span><\/div>\n<div class=\"bub\">{{m.text}}<\/div>\n<\/div>\n<\/sc-for>\n<\/div>\n<div class=\"cmp\">\n<button class=\"icob\" type=\"button\" aria-label=\"Attach file\" style=\"border: 0\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7\"><\/path><\/svg><\/button>\n<label class=\"sr\" for=\"rep\">Write a reply<\/label><input id=\"rep\" placeholder=\"Write a reply\">\n<button class=\"btn pri\" type=\"button\" aria-label=\"Send\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M22 2 11 13M22 2l-7 20-4-9-9-4z\"><\/path><\/svg>Send<\/button>\n<\/div>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{isNew}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"mw\" role=\"dialog\" aria-labelledby=\"nw-h\">\n<div class=\"mwh\">\n<h2 id=\"nw-h\">New message<\/h2>\n<button class=\"mwb\" type=\"button\" aria-label=\"{{minLabel}}\" onClick=\"{{toggleMin}}\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"{{minIcon}}\"><\/path><\/svg><\/button>\n<button class=\"mwb\" type=\"button\" aria-label=\"Close and discard\" onClick=\"{{closeNew}}\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6 6 18\"><\/path><\/svg><\/button>\n<\/div>\n<sc-if value=\"{{isOpenBody}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column\">\n<div class=\"mwr\"><label for=\"to\">To<\/label><select id=\"to\"><option>Los Angeles Vet Clinic (front desk)<\/option><option>Dr. Sarah Davis<\/option><\/select><\/div>\n<div class=\"mwr\"><label for=\"ab\">About<\/label><select id=\"ab\"><option>Snowball<\/option><option>Cosmo<\/option><\/select><\/div>\n<div class=\"mwr\"><label for=\"sj\">Subject<\/label><input id=\"sj\" placeholder=\"e.g. Question about Snowball's medication\"><\/div>\n<label class=\"sr\" for=\"bd\">Message<\/label><textarea class=\"mwt\" id=\"bd\" placeholder=\"Describe what's going on. Photos help too.\"><\/textarea>\n<div class=\"row\" style=\"justify-content: space-between; padding: 12px 16px 12px 20px; border-top: 1px solid #EEF1F4; flex-wrap: wrap; gap: 8px\">\n<div class=\"row\" style=\"gap: 4px\"><button class=\"btn pri\" type=\"button\" onClick=\"{{send}}\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M22 2 11 13M22 2l-7 20-4-9-9-4z\"><\/path><\/svg>Send<\/button><button class=\"icob\" type=\"button\" aria-label=\"Attach photo or file\" style=\"border: 0\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7\"><\/path><\/svg><\/button><\/div>\n<p class=\"xs muted\">Emergency? Call (323) 555-0147<\/p>\n<\/div>\n<\/div>\n<\/sc-if>\n<\/section>\n<\/sc-if>\n<sc-if value=\"{{sent}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"toast\" role=\"status\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"color: #6BE0F8\"><path d=\"M20 6 9 17l-5-5\"><\/path><\/svg>Message sent to the clinic<button class=\"btn sm\" type=\"button\" style=\"background: transparent; color: #6BE0F8; min-height: 28px; padding: 0 6px\" onClick=\"{{hideToast}}\">Dismiss<\/button><\/div>\n<\/sc-if>\n<\/div>\n<\/main>\n<\/div>\n");
</script>
</body>
</html>
