<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vetrail clinic · Upload results</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/vetrail.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.clinic{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:10px;border-radius:16px;background:#F3F5F8}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:#5F6B7C}
.crumb a{text-decoration:none;font-weight:500}
.fx{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.fx div{background:#F7F9FC;border-radius:12px;padding:12px}
.fx p:first-child{font-size:12px;color:#5F6B7C}
.fx p:last-child{font-weight:600}
.mini{width:100%;border-collapse:collapse;font-size:13px}
.mini th{text-align:left;color:#5F6B7C;font-weight:600;font-size:12px;padding:8px 0;border-bottom:1px solid #E8EBF0}
.mini td{padding:9px 0;border-bottom:1px solid #EEF1F4}
.pid{font:600 26px Outfit,sans-serif;letter-spacing:.12em;color:#073B66}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/preact.min.js"></script>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { st: 'empty', id: false }; }
  renderVals() {
    const s = this.state || {};
    const st = s.st || 'empty';
    return {
      isEmpty: st === 'empty', isReview: st === 'review', isShared: st === 'shared',
      noId: !s.id, hasId: !!s.id,
      getId: () => this.setState({ id: true }),
      process: () => this.setState({ st: 'review' }),
      share: () => this.setState({ st: 'shared' }),
      reset: () => this.setState({ st: 'empty' })
    };
  }
}
DCLite.mount(Component, "\n\n<div class=\"app\">\n<nav class=\"side\" aria-label=\"Clinic navigation\">\n<a class=\"brand\" href=\"Clinic-Clients.html\"><img src=\"assets/logo.png\" alt=\"\">Vetrail<\/a>\n<div class=\"clinic\"><span class=\"ic\" style=\"background: #073B66; color: #fff; font: 600 13px Outfit, sans-serif\">LA<\/span><div style=\"min-width: 0\"><p class=\"b\">Los Angeles Vet Clinic<\/p><p class=\"xs muted\">Clinic portal<\/p><\/div><\/div>\n<a class=\"nav\" href=\"Clinic-Clients.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"><\/circle><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5.5 5.5 0 0 1 3.5 6\"><\/path><\/svg>Clients<\/a>\n<a class=\"nav\" href=\"Clinic-Calendar.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><path d=\"M3 10h18M8 3v4M16 3v4\"><\/path><\/svg>Calendar<\/a>\n<a class=\"nav\" href=\"Clinic-Messages.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"><\/path><\/svg>Messages<span class=\"cnt\">3<\/span><\/a>\n<a class=\"nav on\" href=\"Clinic-Upload.html\" aria-current=\"page\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 15V3M7 8l5-5 5 5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2\"><\/path><\/svg>Upload results<\/a>\n<div class=\"grow\"><\/div>\n<a class=\"nav\" href=\"#\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h10M18 7h2M4 17h4M12 17h8\"><\/path><circle cx=\"16\" cy=\"7\" r=\"2\"><\/circle><circle cx=\"10\" cy=\"17\" r=\"2\"><\/circle><\/svg>Settings<\/a>\n<a class=\"nav\" href=\"Owner-Login.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11\"><\/path><\/svg>Log out<\/a>\n<div class=\"me\"><span class=\"av\">SD<\/span><div><p class=\"b\">Dr. Sarah Davis<\/p><p class=\"xs muted\">Veterinarian<\/p><\/div><\/div>\n<\/nav>\n\n<main class=\"main\">\n<div>\n<nav class=\"crumb\" aria-label=\"Breadcrumb\"><a href=\"Clinic-Client.html\">Jane Doe<\/a><span aria-hidden=\"true\">/<\/span><a href=\"Clinic-Pet.html\">Snowball<\/a><span aria-hidden=\"true\">/<\/span><span style=\"color: #3F4A5A\">Upload<\/span><\/nav>\n<h1 style=\"margin-top: 10px\">Upload test results<\/h1>\n<p class=\"sub\" style=\"margin-top: 4px\">Vetrail reads the PDF, pulls out the values and drafts a summary. Nothing reaches the owner until you approve it.<\/p>\n<\/div>\n\n<div class=\"wrap\">\n<div class=\"col\" style=\"flex: 1 1 320px; max-width: 400px\">\n<section class=\"card\" aria-labelledby=\"up-h\">\n<h2 id=\"up-h\">Upload PDF<\/h2>\n<div class=\"fld\" style=\"margin-top: 14px\"><label for=\"pet\">For pet<\/label><select class=\"inp\" id=\"pet\"><option>Snowball · Jane Doe<\/option><option>Cosmo · Jane Doe<\/option><\/select><\/div>\n<div class=\"drop\" style=\"margin-top: 14px\">\n<span class=\"ic info\" style=\"border-radius: 999px\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 15V3M7 8l5-5 5 5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2\"><\/path><\/svg><\/span>\n<p class=\"b\">Drag &amp; drop your file<\/p>\n<p class=\"xs muted\">PDF up to 20 MB<\/p>\n<button class=\"btn sec sm\" type=\"button\" onClick=\"{{process}}\">Browse files<\/button>\n<\/div>\n<\/section>\n\n<section class=\"card\" aria-labelledby=\"id-h\">\n<h2 id=\"id-h\">Pet ID for the owner<\/h2>\n<p class=\"sm sub\" style=\"margin-top: 4px\">Give this ID to the client so they can connect their pet in the app.<\/p>\n<sc-if value=\"{{noId}}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn pri full\" type=\"button\" style=\"margin-top: 14px\" onClick=\"{{getId}}\">Get pet ID<\/button><\/sc-if>\n<sc-if value=\"{{hasId}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"row\" style=\"margin-top: 14px; background: #EAF2FB; border-radius: 14px; padding: 14px 16px; justify-content: space-between\"><span class=\"pid\">201794325<\/span><button class=\"btn sec sm\" type=\"button\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"9\" y=\"9\" width=\"12\" height=\"12\" rx=\"2\"><\/rect><path d=\"M5 15V5a2 2 0 0 1 2-2h10\"><\/path><\/svg>Copy<\/button><\/div>\n<p class=\"xs muted\" style=\"margin-top: 8px\">Also emailed to jane.doe@email.com<\/p>\n<\/sc-if>\n<\/section>\n\n<section class=\"card\" aria-labelledby=\"ru-h\">\n<h2 id=\"ru-h\">Recent uploads<\/h2>\n<div style=\"margin-top: 6px\">\n<div class=\"li\"><span class=\"ic\" style=\"background: #EAF2FB; color: #0B62B5; width: 36px; height: 36px; border-radius: 10px\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"><\/path><path d=\"M14 3v6h6\"><\/path><\/svg><\/span><div style=\"flex: 1; min-width: 0\"><p class=\"b\">Lab Results.pdf<\/p><p class=\"xs muted\">03/10/25 · 245 KB<\/p><\/div><span class=\"pill ok\">Shared<\/span><\/div>\n<div class=\"li\"><span class=\"ic\" style=\"background: #EAF2FB; color: #0B62B5; width: 36px; height: 36px; border-radius: 10px\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"><\/path><path d=\"M14 3v6h6\"><\/path><\/svg><\/span><div style=\"flex: 1; min-width: 0\"><p class=\"b\">Medical Results.pdf<\/p><p class=\"xs muted\">01/09/25 · 1.0 MB<\/p><\/div><span class=\"pill ok\">Shared<\/span><\/div>\n<div class=\"li\"><span class=\"ic\" style=\"background: #EAF2FB; color: #0B62B5; width: 36px; height: 36px; border-radius: 10px\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"><\/path><path d=\"M14 3v6h6\"><\/path><\/svg><\/span><div style=\"flex: 1; min-width: 0\"><p class=\"b\">Prescription.pdf<\/p><p class=\"xs muted\">12/10/24 · 126 KB<\/p><\/div><span class=\"pill neu\">Record only<\/span><\/div>\n<\/div>\n<\/section>\n<\/div>\n\n<section class=\"card\" style=\"flex: 2 1 480px; min-height: 560px; display: flex; flex-direction: column\" aria-label=\"Processed file\">\n<sc-if value=\"{{isEmpty}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"empty\" style=\"flex: 1\">\n<span class=\"ic neu\" style=\"width: 64px; height: 64px; border-radius: 20px\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 30px; height: 30px\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"><\/path><path d=\"M14 3v6h6M9 14h6M9 17h4\"><\/path><\/svg><\/span>\n<h2 style=\"font-size: 22px\">No PDF processed yet<\/h2>\n<p class=\"sub\" style=\"max-width: 400px\">Upload a lab PDF and Vetrail will extract the fields and draft a plain-language summary for you to check.<\/p>\n<button class=\"btn sec\" type=\"button\" onClick=\"{{process}}\">Try with Urinalysis.pdf<\/button>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{isReview}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<div class=\"top\"><div class=\"row\"><span class=\"ic\" style=\"background: #EAF2FB; color: #0B62B5\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z\"><\/path><path d=\"M14 3v6h6\"><\/path><\/svg><\/span><div><h2>Urinalysis.pdf<\/h2><p class=\"xs muted\">Processed just now · 2 pages<\/p><\/div><\/div><span class=\"pill ai\">Needs your review<\/span><\/div>\n<div class=\"fx\">\n<div><p>Patient<\/p><p>Snowball<\/p><\/div>\n<div><p>Owner<\/p><p>Jane Doe<\/p><\/div>\n<div><p>Test<\/p><p>Urinalysis<\/p><\/div>\n<div><p>Collected<\/p><p>Mar 24, 2025<\/p><\/div>\n<\/div>\n<div>\n<h3>Extracted values <span class=\"xs muted\" style=\"font-weight: 400\">· 0 out of range<\/span><\/h3>\n<table class=\"mini\" style=\"margin-top: 6px\">\n<thead><tr><th scope=\"col\">Test<\/th><th scope=\"col\">Result<\/th><th scope=\"col\">Reference<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Specific gravity<\/td><td class=\"b\">1.032<\/td><td class=\"muted\">1.015 – 1.045<\/td><\/tr>\n<tr><td>pH<\/td><td class=\"b\">6.5<\/td><td class=\"muted\">5.5 – 7.5<\/td><\/tr>\n<tr><td>Protein<\/td><td class=\"b\">Negative<\/td><td class=\"muted\">Negative – trace<\/td><\/tr>\n<tr><td>Glucose<\/td><td class=\"b\">Negative<\/td><td class=\"muted\">Negative<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<div class=\"fld\">\n<label for=\"draft\" class=\"row\" style=\"gap: 8px\"><span class=\"pill ai\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z\"><\/path><\/svg>AI draft<\/span>Summary the owner will see<\/label>\n<textarea class=\"inp\" id=\"draft\" style=\"min-height: 130px\">Snowball's urine test looks healthy. His urine is well concentrated, which means he's drinking enough water and his kidneys are working well. No protein, sugar or signs of infection were found. No follow-up is needed.<\/textarea>\n<p class=\"xs muted\">Edit anything before sharing. Jane will see \"Reviewed by Dr. Sarah Davis\".<\/p>\n<\/div>\n<div class=\"row\" style=\"justify-content: flex-end; flex-wrap: wrap; gap: 10px\"><button class=\"btn ghost\" type=\"button\" onClick=\"{{reset}}\">Discard<\/button><button class=\"btn sec\" type=\"button\">Save draft<\/button><button class=\"btn pri\" type=\"button\" onClick=\"{{share}}\">Approve &amp; share with Jane<\/button><\/div>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{isShared}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"empty\" style=\"flex: 1\">\n<span class=\"ic ok\" style=\"width: 64px; height: 64px; border-radius: 999px\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 30px; height: 30px\"><path d=\"M20 6 9 17l-5-5\"><\/path><\/svg><\/span>\n<h2 style=\"font-size: 22px\">Shared with Jane Doe<\/h2>\n<p class=\"sub\" style=\"max-width: 400px\">The urinalysis and your approved summary are now in Snowball's health records. Jane gets a notification.<\/p>\n<div class=\"row\" style=\"gap: 10px; flex-wrap: wrap; justify-content: center\"><button class=\"btn sec\" type=\"button\" onClick=\"{{reset}}\">Upload another<\/button><a class=\"btn pri\" href=\"Clinic-Pet.html\">Back to Snowball<\/a><\/div>\n<\/div>\n<\/sc-if>\n<\/section>\n<\/div>\n<\/main>\n<\/div>\n");
</script>
</body>
</html>
