<body>

<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: '' }; }
  renderVals() {
    const q = ((this.state && this.state.q) || '');
    const P = { peach: ['#FFE6CC', '#7A3E00'], pink: ['#FCE3F2', '#8A1F63'], lilac: ['#E6E0FF', '#4B2FA8'], sky: ['#CFEFFD', '#0A4F78'], mint: ['#DCF3E4', '#12663D'] };
    const pet = (n, c) => ({ n, i: n[0], bg: P[c][0], fg: P[c][1] });
    const C = [
      ['Jane Doe', 'JD', 'jane.doe@email.com', '(323) 555-0182', [pet('Snowball', 'sky'), pet('Cosmo', 'peach')], 'Mar 10', 'Mar 31, 3:00 PM', 'neu'],
      ['Kevin Tran', 'KT', 'kevin.tran@email.com', '(213) 555-0119', [pet('Mochi', 'pink')], 'Mar 3', 'Mar 27, 11:00 AM', 'neu'],
      ['Ana Ruiz', 'AR', 'ana.ruiz@email.com', '(323) 555-0164', [pet('Biscuit', 'peach')], 'Feb 28', 'Not booked', 'warn'],
      ['Sam Okafor', 'SO', 'sam.okafor@email.com', '(310) 555-0102', [pet('Pepper', 'lilac')], 'Mar 18', 'Today, 10:00 AM', 'info'],
      ['Priya Shah', 'PS', 'priya.shah@email.com', '(213) 555-0177', [pet('Luna', 'mint'), pet('Milo', 'sky')], 'Jan 22', 'Today, 2:30 PM', 'info'],
      ['Marcus Reed', 'MR', 'marcus.reed@email.com', '(323) 555-0140', [pet('Bear', 'peach')], 'Dec 12', 'Not booked', 'warn'],
      ['Emily Chen', 'EC', 'emily.chen@email.com', '(626) 555-0133', [pet('Nori', 'pink')], 'Mar 21', 'Apr 21, 9:00 AM', 'neu']
    ];
    const ql = q.trim().toLowerCase();
    const rows = C.filter((c) => !ql || c[0].toLowerCase().includes(ql) || c[4].some((p) => p.n.toLowerCase().includes(ql))).map((c) => ({
      name: c[0], ini: c[1], email: c[2], phone: c[3], pets: c[4], petNames: c[4].map((p) => p.n).join(', '),
      last: c[5], next: c[6], nc: 'pill ' + c[7], bg: '#EAF2FB', fg: '#0A559E'
    }));
    return { q, rows, none: rows.length === 0, onQ: (e) => this.setState({ q: e && e.target ? e.target.value : '' }) };
  }
}
DCLite.mount(Component, "\n\n<div class=\"app\">\n<nav class=\"side\" aria-label=\"Clinic navigation\">\n<a class=\"brand\" href=\"Clinic-Clients.html\"><img src=\"assets/logo.png\" alt=\"\">Vetrail<\/a>\n<div class=\"clinic\"><span class=\"ic\" style=\"background: #073B66; color: #fff; font: 600 13px Outfit, sans-serif\">LA<\/span><div style=\"min-width: 0\"><p class=\"b\">Los Angeles Vet Clinic<\/p><p class=\"xs muted\">Clinic portal<\/p><\/div><\/div>\n<a class=\"nav on\" href=\"Clinic-Clients.html\" aria-current=\"page\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"><\/circle><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5.5 5.5 0 0 1 3.5 6\"><\/path><\/svg>Clients<\/a>\n<a class=\"nav\" href=\"Clinic-Calendar.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><path d=\"M3 10h18M8 3v4M16 3v4\"><\/path><\/svg>Calendar<\/a>\n<a class=\"nav\" href=\"Clinic-Messages.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"><\/path><\/svg>Messages<span class=\"cnt\">3<\/span><\/a>\n<a class=\"nav\" href=\"Clinic-Upload.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 15V3M7 8l5-5 5 5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2\"><\/path><\/svg>Upload results<\/a>\n<div class=\"grow\"><\/div>\n<a class=\"nav\" href=\"#\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h10M18 7h2M4 17h4M12 17h8\"><\/path><circle cx=\"16\" cy=\"7\" r=\"2\"><\/circle><circle cx=\"10\" cy=\"17\" r=\"2\"><\/circle><\/svg>Settings<\/a>\n<a class=\"nav\" href=\"Owner-Login.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11\"><\/path><\/svg>Log out<\/a>\n<div class=\"me\"><span class=\"av\">SD<\/span><div><p class=\"b\">Dr. Sarah Davis<\/p><p class=\"xs muted\">Veterinarian<\/p><\/div><\/div>\n<\/nav>\n\n<main class=\"main\">\n<div class=\"top\">\n<div><h1>Good morning, Dr. Davis<\/h1><p class=\"sub\" style=\"margin-top: 4px\">Monday, March 24 · 9 visits on your calendar today<\/p><\/div>\n<div class=\"row\" style=\"flex-wrap: wrap\">\n<button class=\"icob\" type=\"button\" aria-label=\"Notifications, 3 new\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0\"><\/path><\/svg><span class=\"dot\"><\/span><\/button>\n<a class=\"btn pri sm\" href=\"Clinic-NewClient.html\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg>Add new client<\/a>\n<\/div>\n<\/div>\n\n<section class=\"card\" style=\"display: flex; flex-wrap: wrap; row-gap: 18px; padding: 20px 0\" aria-label=\"Today\">\n<div class=\"stat\"><span class=\"ic info\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><path d=\"M3 10h18M8 3v4M16 3v4\"><\/path><\/svg><\/span><div><p class=\"sm muted\">Visits today<\/p><p class=\"num\">9<\/p><p class=\"xs muted\">Next: Pepper at 10:00 AM<\/p><\/div><\/div>\n<div class=\"stat\"><span class=\"ic warn\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"><\/path><\/svg><\/span><div><p class=\"sm muted\">Unread messages<\/p><p class=\"num\">3<\/p><p class=\"xs muted\">Oldest 2 h ago<\/p><\/div><\/div>\n<div class=\"stat\"><span class=\"ic ai\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z\"><\/path><\/svg><\/span><div><p class=\"sm muted\">Summaries to review<\/p><p class=\"num\">2<\/p><p class=\"xs muted\">From this morning's uploads<\/p><\/div><\/div>\n<\/section>\n\n<section class=\"card flat\" aria-labelledby=\"cl-h\">\n<div class=\"top\" style=\"padding: 20px 24px\">\n<div><h2 id=\"cl-h\">Clients<\/h2><p class=\"xs muted\">128 clients · 164 pets<\/p><\/div>\n<label class=\"search\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"m20 20-3.5-3.5\"><\/path><\/svg><span class=\"sr\">Search clients<\/span><input type=\"search\" placeholder=\"Search by name or pet\" value=\"{{q}}\" onChange=\"{{onQ}}\"><\/label>\n<\/div>\n<div class=\"scroll\"><table class=\"tbl\">\n<thead><tr><th scope=\"col\">Client<\/th><th scope=\"col\">Phone<\/th><th scope=\"col\">Pets<\/th><th scope=\"col\">Last visit<\/th><th scope=\"col\">Next appointment<\/th><th scope=\"col\"><span class=\"sr\">Action<\/span><\/th><\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"7\">\n<tr>\n<td><a class=\"row rowlink\" href=\"Clinic-Client.html\"><span class=\"av\" style=\"background: {{r.bg}}; color: {{r.fg}}\">{{r.ini}}<\/span><div><p class=\"b\">{{r.name}}<\/p><p class=\"xs muted\">{{r.email}}<\/p><\/div><\/a><\/td>\n<td class=\"sub\">{{r.phone}}<\/td>\n<td><div class=\"row\" style=\"gap: 8px\"><span class=\"pets\"><sc-for list=\"{{r.pets}}\" as=\"p\" hint-placeholder-count=\"1\"><span class=\"av\" style=\"width: 28px; height: 28px; font-size: 10px; background: {{p.bg}}; color: {{p.fg}}\">{{p.i}}<\/span><\/sc-for><\/span><span class=\"sm\">{{r.petNames}}<\/span><\/div><\/td>\n<td class=\"muted\">{{r.last}}<\/td>\n<td><span class=\"{{r.nc}}\">{{r.next}}<\/span><\/td>\n<td style=\"text-align: right\"><a class=\"btn sec sm\" href=\"Clinic-Client.html\">View<\/a><\/td>\n<\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table><\/div>\n<sc-if value=\"{{none}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"empty muted\">No clients match \"{{q}}\".<\/p><\/sc-if>\n<\/section>\n<\/main>\n<\/div>\n");
</script>
</body>
</html>
