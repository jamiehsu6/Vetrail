<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vetrail · Appointments</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/vetrail.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ap{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;border:1px solid #E8EBF0;border-radius:18px;padding:16px;cursor:pointer;font:inherit;color:inherit}
.ap:hover{border-color:#C6D6EA}
.ap.on{border-color:#0B62B5;box-shadow:0 0 0 3px #D3E5F8}
.band{display:flex;align-items:center;gap:10px;padding:14px 24px;font-weight:600}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px}
.fg .lbl{font-weight:500;color:#5F6B7C;font-size:12px}
.ln{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EEF1F4}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/preact.min.js"></script>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'up', sel: 'u1' }; }
  renderVals() {
    const s = this.state || {};
    const tab = s.tab || 'up';
    const CHECK = 'M20 6 9 17l-5-5';
    const CLOCK = 'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z';
    const A = {
      up: [
        { id: 'u1', mon: 'Mar', day: '31', reason: 'Annual check-up & vaccination', time: 'Mon, 3:00 PM', when: '3:00 PM, Monday, March 31, 2025', vet: 'Dr. Sarah Davis', vetIni: 'SD', status: 'Confirmed', p: 'ok' },
        { id: 'u2', mon: 'Apr', day: '14', reason: 'Recheck bloodwork', time: 'Mon, 10:30 AM', when: '10:30 AM, Monday, April 14, 2025', vet: 'Dr. Sarah Davis', vetIni: 'SD', status: 'Awaiting clinic', p: 'warn' }
      ],
      past: [
        { id: 'p1', mon: 'Mar', day: '10', reason: 'Lab work (CBC + chemistry)', time: 'Mon, 9:00 AM', when: '9:00 AM, Monday, March 10, 2025', vet: 'Dr. Sarah Davis', vetIni: 'SD', status: 'Completed', p: 'neu', items: [{ n: 'Blood panel (CBC + chemistry)', p: '$200' }], total: '$200', notes: 'Blood drawn for routine panel. Snowball did great. Results will be summarized once reviewed.' },
        { id: 'p2', mon: 'Feb', day: '23', reason: 'Annual check-up & vaccination', time: 'Sun, 3:00 PM', when: '3:00 PM, Sunday, February 23, 2025', vet: 'Dr. Sarah Davis', vetIni: 'SD', status: 'Completed', p: 'neu', items: [{ n: 'Annual check-up', p: '$150' }, { n: 'Bordetella vaccine', p: '$50' }, { n: 'Leptospirosis vaccine', p: '$50' }], total: '$250', notes: 'Healthy weight gain. Vaccines given with no reaction. Next Bordetella due in June.' },
        { id: 'p3', mon: 'Jan', day: '9', reason: 'Emergency visit', time: 'Thu, 7:40 PM', when: '7:40 PM, Thursday, January 9, 2025', vet: 'Dr. Mark Chen', vetIni: 'MC', status: 'Completed', p: 'neu', items: [{ n: 'Urgent exam', p: '$80' }], total: '$80', notes: 'Mild stomach upset after eating something in the yard. Bland diet for 3 days. No follow-up needed.' }
      ]
    };
    const list = A[tab];
    const sel = list.find((a) => a.id === s.sel) || list[0];
    const isUp = tab === 'up';
    const band = isUp
      ? (sel.p === 'ok' ? { bandBg: '#E6F5EC', bandFg: '#12663D', bandIcon: CHECK, bandText: 'Appointment confirmed' } : { bandBg: '#FFF0E3', bandFg: '#9C430B', bandIcon: CLOCK, bandText: 'Waiting for the clinic to confirm' })
      : { bandBg: '#F1F3F6', bandFg: '#4A5565', bandIcon: CHECK, bandText: 'Appointment completed' };
    return {
      isUp, isPast: !isUp,
      tabUp: isUp ? 'tab on' : 'tab', tabPast: isUp ? 'tab' : 'tab on',
      selUp: isUp ? 'true' : 'false', selPast: isUp ? 'false' : 'true',
      goUp: () => this.setState({ tab: 'up', sel: 'u1' }),
      goPast: () => this.setState({ tab: 'past', sel: 'p1' }),
      list: list.map((a) => ({ ...a, cls: a.id === sel.id ? 'ap on' : 'ap', pcls: 'pill ' + a.p, pick: () => this.setState({ sel: a.id }) })),
      d: { ...sel, ...band, items: sel.items || [], total: sel.total || '', notes: sel.notes || '' }
    };
  }
}
DCLite.mount(Component, "\n\n<div class=\"app\">\n<nav class=\"side\" aria-label=\"Main navigation\">\n<a class=\"brand\" href=\"index.html\"><img src=\"assets/logo.png\" alt=\"\">Vetrail<\/a>\n<a class=\"petsw\" href=\"Owner-ChoosePet.html\" aria-label=\"Switch pet, current pet Snowball\"><img src=\"assets/snowball.jpg\" alt=\"\"><div style=\"flex: 1; min-width: 0\"><p class=\"b\">Snowball<\/p><p class=\"xs muted\">Switch pet<\/p><\/div><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m7 9 5-5 5 5M7 15l5 5 5-5\"><\/path><\/svg><\/a>\n<a class=\"nav\" href=\"index.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"><\/path><\/svg>Home<\/a>\n<a class=\"nav on\" href=\"Owner-Appointments.html\" aria-current=\"page\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><path d=\"M3 10h18M8 3v4M16 3v4\"><\/path><\/svg>Appointments<\/a>\n<a class=\"nav\" href=\"Owner-Messages.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"><\/path><\/svg>Messages<span class=\"cnt\">2<\/span><\/a>\n<a class=\"nav\" href=\"Owner-Records.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"><\/rect><path d=\"M9 4V3h6v1M9 10h6M9 14h4\"><\/path><\/svg>Health records<\/a>\n<a class=\"nav\" href=\"Owner-Billing.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z\"><\/path><path d=\"M9 8h6M9 12h6\"><\/path><\/svg>Billing<\/a>\n<div class=\"grow\"><\/div>\n<a class=\"nav\" href=\"Owner-Settings.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h10M18 7h2M4 17h4M12 17h8\"><\/path><circle cx=\"16\" cy=\"7\" r=\"2\"><\/circle><circle cx=\"10\" cy=\"17\" r=\"2\"><\/circle><\/svg>Settings<\/a>\n<a class=\"nav\" href=\"Owner-Login.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11\"><\/path><\/svg>Log out<\/a>\n<div class=\"me\"><span class=\"av\">JD<\/span><div><p class=\"b\">Jane Doe<\/p><p class=\"xs muted\">Los Angeles Vet Clinic<\/p><\/div><\/div>\n<\/nav>\n\n<main class=\"main\">\n<div class=\"top\">\n<div><h1>Appointments<\/h1><p class=\"sub\" style=\"margin-top: 4px\">Snowball's visits at Los Angeles Vet Clinic<\/p><\/div>\n<a class=\"btn pri\" href=\"Owner-Book.html\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg>Schedule appointment<\/a>\n<\/div>\n\n<div class=\"tabs\" role=\"tablist\" aria-label=\"Appointment list\">\n<button class=\"{{tabUp}}\" type=\"button\" role=\"tab\" aria-selected=\"{{selUp}}\" onClick=\"{{goUp}}\">Upcoming <span class=\"xs muted\">2<\/span><\/button>\n<button class=\"{{tabPast}}\" type=\"button\" role=\"tab\" aria-selected=\"{{selPast}}\" onClick=\"{{goPast}}\">Past <span class=\"xs muted\">3<\/span><\/button>\n<\/div>\n\n<div class=\"wrap\">\n<div style=\"flex: 1 1 380px; display: flex; flex-direction: column; gap: 12px; min-width: 0\">\n<sc-for list=\"{{list}}\" as=\"a\" hint-placeholder-count=\"2\">\n<button class=\"{{a.cls}}\" type=\"button\" onClick=\"{{a.pick}}\">\n<span class=\"date\">{{a.mon}}<b>{{a.day}}<\/b><\/span>\n<span style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px\">\n<span class=\"b\" style=\"font-size: 15px\">{{a.reason}}<\/span>\n<span class=\"sm muted\">{{a.time}} · {{a.vet}}<\/span>\n<\/span>\n<span class=\"{{a.pcls}}\">{{a.status}}<\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n\n<section class=\"card flat\" style=\"flex: 1.3 1 440px\" aria-labelledby=\"det-h\">\n<div class=\"band\" style=\"background: {{d.bandBg}}; color: {{d.bandFg}}\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"{{d.bandIcon}}\"><\/path><\/svg>{{d.bandText}}<\/div>\n<div style=\"padding: 24px; display: flex; flex-direction: column; gap: 22px\">\n<h2 id=\"det-h\" style=\"font-size: 20px\">{{d.reason}}<\/h2>\n<div class=\"fg\">\n<div><p class=\"lbl\">Date &amp; time<\/p><p class=\"b\">{{d.when}}<\/p><\/div>\n<div><p class=\"lbl\">Booked for<\/p><p class=\"b\">Snowball<\/p><\/div>\n<div><p class=\"lbl\">Clinic<\/p><p class=\"b\">Los Angeles Vet Clinic<\/p><p class=\"sm muted row\" style=\"gap: 6px; margin-top: 2px\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z\"><\/path><circle cx=\"12\" cy=\"10\" r=\"2.5\"><\/circle><\/svg>1544 W Slauson Ave, Los Angeles, CA 90047<\/p><\/div>\n<div><p class=\"lbl\">Veterinarian<\/p><div class=\"row\" style=\"gap: 8px; margin-top: 2px\"><span class=\"av\" style=\"width: 28px; height: 28px; font-size: 10px\">{{d.vetIni}}<\/span><p class=\"b\">{{d.vet}}<\/p><\/div><\/div>\n<\/div>\n\n<sc-if value=\"{{isUp}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"row\" style=\"flex-wrap: wrap; gap: 10px; border-top: 1px solid #E8EBF0; padding-top: 20px\">\n<button class=\"btn sec\" type=\"button\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><path d=\"M3 10h18M8 3v4M16 3v4M12 14v4M10 16h4\"><\/path><\/svg>Add to calendar<\/button>\n<div class=\"grow\" style=\"min-height: 0\"><\/div>\n<button class=\"btn ghost\" type=\"button\">Cancel<\/button>\n<a class=\"btn pri\" href=\"Owner-Book.html\">Reschedule<\/a>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{isPast}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; border-top: 1px solid #E8EBF0; padding-top: 20px\">\n<div>\n<h3>Booking details<\/h3>\n<div style=\"margin-top: 6px\">\n<sc-for list=\"{{d.items}}\" as=\"it\" hint-placeholder-count=\"2\">\n<div class=\"ln\"><span class=\"sub\">{{it.n}}<\/span><span class=\"b\">{{it.p}}<\/span><\/div>\n<\/sc-for>\n<div class=\"ln\" style=\"border-bottom: 0\"><span class=\"b\">Total<\/span><span class=\"b\" style=\"font-size: 16px\">{{d.total}}<\/span><\/div>\n<\/div>\n<\/div>\n<div style=\"background: #F7F9FC; border-radius: 14px; padding: 16px\"><p class=\"lbl\" style=\"font-weight: 500; color: #5F6B7C; font-size: 12px\">Appointment notes<\/p><p class=\"sub\" style=\"margin-top: 4px\">{{d.notes}}<\/p><\/div>\n<div class=\"row\" style=\"flex-wrap: wrap; gap: 10px\"><a class=\"btn pri\" href=\"Owner-Records.html\">View results<\/a><a class=\"btn sec\" href=\"Owner-Billing.html\">View receipt<\/a><\/div>\n<\/div>\n<\/sc-if>\n<\/div>\n<\/section>\n<\/div>\n<\/main>\n<\/div>\n");
</script>
</body>
</html>
