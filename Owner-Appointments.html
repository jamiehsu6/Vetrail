<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vetrail · Appointments</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/vetrail.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ap{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid #E8EBF0;border-radius:18px;padding:14px 16px;cursor:pointer;font:inherit;color:inherit}
.ap:hover{border-color:#C6D6EA}
.ap.on{border-color:#0B62B5;box-shadow:0 0 0 3px #D3E5F8}
.ap .t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.dhead{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;padding:24px 24px 20px;border-bottom:1px solid #EEF1F4}
.dhead .date{width:64px;padding:10px 0}
.acts{display:flex;flex-wrap:wrap;gap:10px;padding:16px 24px;border-bottom:1px solid #EEF1F4;background:#FAFBFC}
.dinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px 28px;padding:22px 24px}
.dinfo .lbl{font-size:12px;font-weight:500;color:#5F6B7C;margin-bottom:4px}
.lnkrow{display:inline-flex;align-items:center;gap:6px;font-weight:500;text-decoration:none;min-height:28px}
.lnkrow:hover{text-decoration:underline}
.prep{margin:0 24px 24px;border-radius:18px;background:#F5F9FE;border:1px solid #DCE8F6;padding:20px}
.pi{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #E3ECF7}
.pi:last-child{border-bottom:0;padding-bottom:0}
.pi .ic{width:36px;height:36px;border-radius:10px}
.pi ul{margin:6px 0 0;padding-left:18px;color:#3F4A5A}
.pi li{margin:2px 0}
.alert{background:#FFF6EE;border:1px solid #F5D9C2;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.manage{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:18px 24px;border-top:1px solid #EEF1F4}
.danger{background:#fff;color:#B42318;border-color:#F3C1BC}
.danger:hover{background:#FEF3F2;color:#912018;border-color:#E8A49D}
.dangerf{background:#D92D20;color:#fff}
.dangerf:hover{background:#B42318;color:#fff}
.ln{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EEF1F4}
.scrim{position:fixed;inset:0;background:rgba(15,27,42,.42);display:flex;align-items:center;justify-content:center;padding:16px;z-index:80;animation:vt-fade .3s ease-out both}
.dlg{background:#fff;border-radius:22px;max-width:480px;width:100%;padding:28px;box-shadow:0 24px 64px rgba(15,27,42,.28);display:flex;flex-direction:column;gap:16px;animation:vt-rise .45s cubic-bezier(.22,1,.36,1) both}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0F1B2A;color:#fff;border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:10px;font:500 14px Inter,sans-serif;z-index:60}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/preact.min.js"></script>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'up', sel: 'u1', cal: {}, checked: {}, cancelled: {}, confirm: false, toast: '' }; }
  flash(msg, extra) {
    if (this.tt) clearTimeout(this.tt);
    this.setState({ ...(extra || {}), toast: msg });
    this.tt = setTimeout(() => this.setState({ toast: '' }), 3500);
  }
  componentWillUnmount() { if (this.tt) clearTimeout(this.tt); }
  renderVals() {
    const s = this.state || {};
    const tab = s.tab || 'up';
    const cal = s.cal || {}, checked = s.checked || {}, cancelled = s.cancelled || {};
    const CHECK = 'M20 6 9 17l-5-5';
    const CLOCK = 'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z';
    const X = 'M6 6l12 12M18 6 6 18';
    const A = {
      up: [
        { id: 'u1', mon: 'Mar', day: '31', reason: 'Annual check-up & vaccination', time: 'Mon, 3:00 PM', when: 'Monday, March 31 at 3:00 PM', vet: 'Dr. Sarah Davis', vetIni: 'SD', length: 'About 30 minutes', st: 'ok', freeUntil: 'Sun, Mar 30 at 3:00 PM', checkOpens: 'Skips the line at the front desk',
          prep: { arrive: '2:50 PM', fastIc: 'ic ok', fastTitle: 'No fasting needed', fastText: 'Snowball can eat and drink as usual. A small treat before the car ride is fine.', fastAlert: '',
            bring: ['A fresh stool sample (from the last 12 hours) for the yearly fecal test', 'A list of food and supplements Snowball eats', 'His leash and harness. Vaccine records are already on file, no need to bring them'],
            vax: 'Bordetella booster is due in June. Dr. Davis can give it at this visit so you don\'t need another trip.',
            cost: '$150 – $200', costLines: ['Annual exam · $150', 'Bordetella booster, if given · $50'] } },
        { id: 'u2', mon: 'Apr', day: '14', reason: 'Recheck bloodwork', time: 'Mon, 10:30 AM', when: 'Monday, April 14 at 10:30 AM', vet: 'Dr. Sarah Davis', vetIni: 'SD', length: 'About 20 minutes', st: 'warn', freeUntil: 'Sun, Apr 13 at 10:30 AM', checkOpens: 'Available once the clinic confirms',
          prep: { arrive: '10:20 AM', fastIc: 'ic warn', fastTitle: 'Fasting required', fastText: 'No food for 12 hours before the visit, so the blood test is accurate. Water is fine and important.', fastAlert: 'Last meal by 10:30 PM on Sunday, April 13. Keep his water bowl full, the recheck is for a slightly high BUN that can come from mild dehydration.',
            bring: ['Nothing special. Results from March 10 are already on file', 'A treat for after the blood draw'],
            vax: 'None due at this visit.',
            cost: '$120 – $160', costLines: ['Recheck exam · $60', 'Chemistry panel · $60 – $100'] } }
      ],
      past: [
        { id: 'p1', mon: 'Mar', day: '10', reason: 'Lab work (CBC + chemistry)', time: 'Mon, 9:00 AM', when: 'Monday, March 10 at 9:00 AM', vet: 'Dr. Sarah Davis', vetIni: 'SD', length: '20 minutes', st: 'done', items: [{ n: 'Blood panel (CBC + chemistry)', p: '$200' }], total: '$200', notes: 'Blood drawn for a routine panel. Snowball did great. Results were summarized and shared on March 12.' },
        { id: 'p2', mon: 'Feb', day: '23', reason: 'Annual check-up & vaccination', time: 'Sun, 3:00 PM', when: 'Sunday, February 23 at 3:00 PM', vet: 'Dr. Sarah Davis', vetIni: 'SD', length: '35 minutes', st: 'done', items: [{ n: 'Annual check-up', p: '$150' }, { n: 'Bordetella vaccine', p: '$50' }, { n: 'Leptospirosis vaccine', p: '$50' }], total: '$250', notes: 'Healthy weight gain. Vaccines given with no reaction. Next Bordetella due in June.' },
        { id: 'p3', mon: 'Jan', day: '9', reason: 'Emergency visit', time: 'Thu, 7:40 PM', when: 'Thursday, January 9 at 7:40 PM', vet: 'Dr. Mark Chen', vetIni: 'MC', length: '45 minutes', st: 'done', items: [{ n: 'Urgent exam', p: '$80' }], total: '$80', notes: 'Mild stomach upset after eating something in the yard. Bland diet for 3 days. No follow-up needed.' }
      ]
    };
    const statusOf = (a) => {
      if (cancelled[a.id]) return { status: 'Cancelled', pcls: 'pill neu', picon: X, note: 'You cancelled this visit.' };
      if (a.st === 'ok') return { status: 'Confirmed', pcls: 'pill ok', picon: CHECK, note: checked[a.id] ? 'Checked in online. Head straight to the front desk.' : 'Confirmed by the clinic. We\'ll remind you the day before.' };
      if (a.st === 'warn') return { status: 'Awaiting clinic', pcls: 'pill warn', picon: CLOCK, note: 'Requested. The clinic usually confirms within a few hours.' };
      return { status: 'Completed', pcls: 'pill neu', picon: CHECK, note: 'Visit completed.' };
    };
    const list = A[tab];
    const cur = list.find((a) => a.id === s.sel) || list[0];
    const cst = statusOf(cur);
    const isUp = tab === 'up';
    const isCx = !!cancelled[cur.id];
    const p = cur.prep || { bring: [], costLines: [] };
    const canCheck = cur.st === 'ok' && !checked[cur.id];
    return {
      upCount: A.up.filter((a) => !cancelled[a.id]).length,
      tabUp: isUp ? 'tab on' : 'tab', tabPast: isUp ? 'tab' : 'tab on',
      selUp: isUp ? 'true' : 'false', selPast: isUp ? 'false' : 'true',
      goUp: () => this.setState({ tab: 'up', sel: 'u1' }),
      goPast: () => this.setState({ tab: 'past', sel: 'p1' }),
      list: list.map((a) => { const st = statusOf(a); return { ...a, ...st, cls: a.id === cur.id ? 'ap on' : 'ap', pressed: a.id === cur.id ? 'true' : 'false', pick: () => this.setState({ sel: a.id, toast: '' }) }; }),
      d: { ...cur, ...cst, statusNote: cst.note, items: cur.items || [], total: cur.total || '', notes: cur.notes || '' },
      p,
      showUpActions: isUp && !isCx, showPrep: isUp && !isCx, isCancelled: isUp && isCx, isPast: !isUp,
      calLabel: cal[cur.id] ? 'Added to calendar' : 'Add to calendar',
      calIcon: cal[cur.id] ? CHECK : 'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5',
      addCal: () => this.flash('Added to your calendar with a reminder 1 hour before', { cal: { ...cal, [cur.id]: true } }),
      checkLabel: checked[cur.id] ? 'Checked in' : 'Check in online',
      checkCls: 'btn sec sm',
      checkDisabled: !canCheck,
      checkNote: checked[cur.id] ? 'The front desk knows you\'re on the way.' : cur.checkOpens,
      checkIn: () => this.flash('You\'re checked in for Monday at 3:00 PM', { checked: { ...checked, [cur.id]: true } }),
      askCancel: () => this.setState({ confirm: true }),
      keep: () => this.setState({ confirm: false }),
      doCancel: () => this.flash('Appointment cancelled. The clinic has been notified.', { confirm: false, cancelled: { ...cancelled, [cur.id]: true } }),
      confirmOpen: !!s.confirm,
      toast: s.toast || '',
      hideToast: () => this.setState({ toast: '' })
    };
  }
}
DCLite.mount(Component, "\n\n<div class=\"app\">\n<nav class=\"side\" aria-label=\"Main navigation\">\n<a class=\"brand\" href=\"index.html\"><img src=\"assets/logo.png\" alt=\"\">Vetrail<\/a>\n<a class=\"petsw\" href=\"Owner-ChoosePet.html\" aria-label=\"Switch pet, current pet Snowball\"><img src=\"assets/snowball.jpg\" alt=\"\"><div style=\"flex: 1; min-width: 0\"><p class=\"b\">Snowball<\/p><p class=\"xs muted\">Switch pet<\/p><\/div><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m7 9 5-5 5 5M7 15l5 5 5-5\"><\/path><\/svg><\/a>\n<a class=\"nav\" href=\"index.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"><\/path><\/svg>Home<\/a>\n<a class=\"nav on\" href=\"Owner-Appointments.html\" aria-current=\"page\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><path d=\"M3 10h18M8 3v4M16 3v4\"><\/path><\/svg>Appointments<\/a>\n<a class=\"nav\" href=\"Owner-Messages.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"><\/path><\/svg>Messages<span class=\"cnt\">2<\/span><\/a>\n<a class=\"nav\" href=\"Owner-Records.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"><\/rect><path d=\"M9 4V3h6v1M9 10h6M9 14h4\"><\/path><\/svg>Health records<\/a>\n<a class=\"nav\" href=\"Owner-Billing.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z\"><\/path><path d=\"M9 8h6M9 12h6\"><\/path><\/svg>Billing<\/a>\n<div class=\"grow\"><\/div>\n<a class=\"nav\" href=\"Owner-Settings.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h10M18 7h2M4 17h4M12 17h8\"><\/path><circle cx=\"16\" cy=\"7\" r=\"2\"><\/circle><circle cx=\"10\" cy=\"17\" r=\"2\"><\/circle><\/svg>Settings<\/a>\n<a class=\"nav\" href=\"Owner-Login.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11\"><\/path><\/svg>Log out<\/a>\n<div class=\"me\"><span class=\"av\">JD<\/span><div><p class=\"b\">Jane Doe<\/p><p class=\"xs muted\">Los Angeles Vet Clinic<\/p><\/div><\/div>\n<\/nav>\n\n<main class=\"main\">\n<div class=\"top\">\n<div><h1>Appointments<\/h1><p class=\"sub\" style=\"margin-top: 4px\">Snowball's visits at Los Angeles Vet Clinic<\/p><\/div>\n<a class=\"btn pri\" href=\"Owner-Book.html\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg>Schedule appointment<\/a>\n<\/div>\n\n<div class=\"tabs\" role=\"tablist\" aria-label=\"Appointment list\">\n<button class=\"{{tabUp}}\" type=\"button\" role=\"tab\" aria-selected=\"{{selUp}}\" onClick=\"{{goUp}}\">Upcoming <span class=\"xs muted\">{{upCount}}<\/span><\/button>\n<button class=\"{{tabPast}}\" type=\"button\" role=\"tab\" aria-selected=\"{{selPast}}\" onClick=\"{{goPast}}\">Past <span class=\"xs muted\">3<\/span><\/button>\n<\/div>\n\n<div class=\"wrap\">\n<div class=\"col\" style=\"flex: 1 1 320px; max-width: 420px; gap: 12px\">\n<sc-for list=\"{{list}}\" as=\"a\" hint-placeholder-count=\"2\">\n<button class=\"{{a.cls}}\" type=\"button\" onClick=\"{{a.pick}}\" aria-pressed=\"{{a.pressed}}\">\n<span class=\"date\">{{a.mon}}<b>{{a.day}}<\/b><\/span>\n<span class=\"t\"><span class=\"b\" style=\"font-size: 15px\">{{a.reason}}<\/span><span class=\"sm muted\">{{a.time}} · {{a.vet}}<\/span><\/span>\n<span class=\"{{a.pcls}}\">{{a.status}}<\/span>\n<\/button>\n<\/sc-for>\n\n<section class=\"card\" style=\"margin-top: 8px; padding: 20px\" aria-labelledby=\"cl-h\">\n<h3 id=\"cl-h\">Los Angeles Vet Clinic<\/h3>\n<a class=\"lnkrow sm\" href=\"https://www.google.com/maps/search/?api=1&amp;query=1544+W+Slauson+Ave,+Los+Angeles,+CA+90047\" target=\"_blank\" rel=\"noopener\" style=\"margin-top: 6px\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z\"><\/path><circle cx=\"12\" cy=\"10\" r=\"2.5\"><\/circle><\/svg>1544 W Slauson Ave, Los Angeles<\/a>\n<a class=\"lnkrow sm\" href=\"tel:+13235550147\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2\"><\/path><\/svg>(323) 555-0147<\/a>\n<p class=\"xs muted\" style=\"margin-top: 8px\">Open today 8 AM – 6 PM · Sat 9 AM – 2 PM<\/p>\n<\/section>\n<section class=\"card\" style=\"padding: 20px\" aria-labelledby=\"cu-h\">\n<h3 id=\"cu-h\">Coming up for Snowball<\/h3>\n<div class=\"li\" style=\"padding: 12px 0\"><span class=\"ic ok\" style=\"width: 34px; height: 34px; border-radius: 10px\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\/path><\/svg><\/span><div style=\"flex: 1\"><p class=\"sm b\">Bordetella booster<\/p><p class=\"xs muted\">Due June 2025 · can be done Mar 31<\/p><\/div><\/div>\n<div class=\"li\" style=\"padding: 12px 0\"><span class=\"ic\" style=\"background: #FCE3F2; color: #8A1F63; width: 34px; height: 34px; border-radius: 10px\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M10.5 20.5 3.5 13.5a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7zM8.5 8.5l7 7\"><\/path><\/svg><\/span><div style=\"flex: 1\"><p class=\"sm b\">Heartgard Plus &amp; Simparica<\/p><p class=\"xs muted\">Monthly doses due Apr 1<\/p><\/div><\/div>\n<div class=\"li\" style=\"padding: 12px 0 0\"><span class=\"ic info\" style=\"width: 34px; height: 34px; border-radius: 10px\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3\"><\/path><\/svg><\/span><div style=\"flex: 1\"><p class=\"sm b\">Bloodwork recheck<\/p><p class=\"xs muted\">Requested for Apr 14<\/p><\/div><\/div>\n<\/section>\n<\/div>\n\n<section class=\"card flat\" style=\"flex: 2 1 520px\" aria-labelledby=\"det-h\">\n<div class=\"dhead\">\n<span class=\"date\">{{d.mon}}<b>{{d.day}}<\/b><\/span>\n<div style=\"flex: 1 1 260px; min-width: 0\">\n<div class=\"row\" style=\"flex-wrap: wrap; gap: 10px\"><h2 id=\"det-h\" style=\"font-size: 21px\">{{d.reason}}<\/h2><span class=\"{{d.pcls}}\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"{{d.picon}}\"><\/path><\/svg>{{d.status}}<\/span><\/div>\n<p class=\"sub\" style=\"margin-top: 6px\">{{d.when}}<\/p>\n<p class=\"sm muted\" style=\"margin-top: 2px\">{{d.statusNote}}<\/p>\n<\/div>\n<\/div>\n\n<sc-if value=\"{{showUpActions}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"acts\">\n<button class=\"btn pri\" type=\"button\" onClick=\"{{addCal}}\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"{{calIcon}}\"><\/path><\/svg>{{calLabel}}<\/button>\n<a class=\"btn sec\" href=\"https://www.google.com/maps/dir/?api=1&amp;destination=1544+W+Slauson+Ave,+Los+Angeles,+CA+90047\" target=\"_blank\" rel=\"noopener\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 11 21 3l-8 18-2-8z\"><\/path><\/svg>Get directions<\/a>\n<a class=\"btn sec\" href=\"tel:+13235550147\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2\"><\/path><\/svg>Call clinic<\/a>\n<\/div>\n<\/sc-if>\n\n<div class=\"dinfo\">\n<div><p class=\"lbl\">Clinic<\/p><p class=\"b\">Los Angeles Vet Clinic<\/p><a class=\"lnkrow sm\" href=\"https://www.google.com/maps/search/?api=1&amp;query=1544+W+Slauson+Ave,+Los+Angeles,+CA+90047\" target=\"_blank\" rel=\"noopener\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z\"><\/path><circle cx=\"12\" cy=\"10\" r=\"2.5\"><\/circle><\/svg>1544 W Slauson Ave, Los Angeles, CA 90047<\/a><br><a class=\"lnkrow sm\" href=\"tel:+13235550147\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2\"><\/path><\/svg>(323) 555-0147<\/a><\/div>\n<div><p class=\"lbl\">Veterinarian<\/p><div class=\"row\" style=\"gap: 8px\"><span class=\"av\" style=\"width: 28px; height: 28px; font-size: 10px\">{{d.vetIni}}<\/span><p class=\"b\">{{d.vet}}<\/p><\/div><\/div>\n<div><p class=\"lbl\">Booked for<\/p><div class=\"row\" style=\"gap: 8px\"><img src=\"assets/snowball.jpg\" alt=\"\" style=\"width: 28px; height: 28px; border-radius: 8px; object-fit: cover\"><p class=\"b\">Snowball<\/p><\/div><\/div>\n<div><p class=\"lbl\">Visit length<\/p><p class=\"b\">{{d.length}}<\/p><\/div>\n<\/div>\n\n<sc-if value=\"{{showPrep}}\" hint-placeholder-val=\"{{ true }}\">\n<section class=\"prep\" aria-labelledby=\"prep-h\">\n<div class=\"row\" style=\"justify-content: space-between; flex-wrap: wrap; gap: 10px\"><h3 id=\"prep-h\" style=\"font-size: 17px\">Before your visit<\/h3><span class=\"xs muted\">From Dr. Davis's notes<\/span><\/div>\n\n<div class=\"pi\"><span class=\"ic info\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 7v5l3 2\"><\/path><\/svg><\/span><div style=\"flex: 1\"><p class=\"b\">Arrive by {{p.arrive}}<\/p><p class=\"sm sub\">10 minutes early gives the front desk time to check Snowball's weight.<\/p>\n<div class=\"row\" style=\"flex-wrap: wrap; gap: 10px; margin-top: 10px\"><button class=\"{{checkCls}}\" type=\"button\" disabled=\"{{checkDisabled}}\" onClick=\"{{checkIn}}\">{{checkLabel}}<\/button><span class=\"xs muted\">{{checkNote}}<\/span><\/div><\/div><\/div>\n\n<div class=\"pi\"><span class=\"{{p.fastIc}}\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 2v7a3 3 0 0 0 6 0V2M6 2v20M21 15V2a5 5 0 0 0-5 5v6a2 2 0 0 0 2 2h3zm0 0v7\"><\/path><\/svg><\/span><div style=\"flex: 1\"><p class=\"b\">{{p.fastTitle}}<\/p><p class=\"sm sub\">{{p.fastText}}<\/p>\n<sc-if value=\"{{p.fastAlert}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"alert\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"color: #9C430B; margin-top: 2px\"><path d=\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01\"><\/path><\/svg><p class=\"sm\" style=\"color: #7A3608\">{{p.fastAlert}}<\/p><\/div><\/sc-if>\n<\/div><\/div>\n\n<div class=\"pi\"><span class=\"ic neu\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 7h12l-1 13H7zM9 7V5a3 3 0 0 1 6 0v2\"><\/path><\/svg><\/span><div style=\"flex: 1\"><p class=\"b\">What to bring<\/p><ul class=\"sm\"><sc-for list=\"{{p.bring}}\" as=\"x\" hint-placeholder-count=\"3\"><li>{{x}}<\/li><\/sc-for><\/ul><\/div><\/div>\n\n<div class=\"pi\"><span class=\"ic ok\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\/path><path d=\"m9 12 2 2 4-4\"><\/path><\/svg><\/span><div style=\"flex: 1\"><p class=\"b\">Vaccines<\/p><p class=\"sm sub\">{{p.vax}}<\/p><\/div><\/div>\n\n<div class=\"pi\"><span class=\"ic warn\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z\"><\/path><path d=\"M9 8h6M9 12h6\"><\/path><\/svg><\/span><div style=\"flex: 1\"><div class=\"row\" style=\"justify-content: space-between; flex-wrap: wrap\"><p class=\"b\">Estimated cost<\/p><p class=\"b\" style=\"font-size: 16px\">{{p.cost}}<\/p><\/div><ul class=\"sm\"><sc-for list=\"{{p.costLines}}\" as=\"c\" hint-placeholder-count=\"2\"><li>{{c}}<\/li><\/sc-for><\/ul><p class=\"xs muted\" style=\"margin-top: 6px\">Final cost depends on what Dr. Davis finds. You'll get the bill in the app.<\/p><\/div><\/div>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{showUpActions}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"manage\">\n<div style=\"flex: 1 1 260px\"><p class=\"sm b\">Need to change this visit?<\/p><p class=\"xs muted\" style=\"margin-top: 2px\">Free to cancel or reschedule until {{d.freeUntil}}. After that there's a $25 late-cancellation fee.<\/p><\/div>\n<div class=\"row\" style=\"gap: 10px; flex-wrap: wrap\"><a class=\"btn sec\" href=\"Owner-Book.html\">Reschedule<\/a><span style=\"width: 1px; height: 28px; background: #E8EBF0\" aria-hidden=\"true\"><\/span><button class=\"btn danger\" type=\"button\" onClick=\"{{askCancel}}\">Cancel appointment<\/button><\/div>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{isCancelled}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"manage\" style=\"border-top: 0; padding-top: 0\"><p class=\"sm sub\">This visit was cancelled. No fee was charged.<\/p><a class=\"btn pri\" href=\"Owner-Book.html\">Book a new time<\/a><\/div>\n<\/sc-if>\n\n<sc-if value=\"{{isPast}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding: 0 24px 24px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"background: #F7F9FC; border-radius: 16px; padding: 18px\"><p class=\"lbl\" style=\"font-size: 12px; color: #5F6B7C\">Visit notes from {{d.vet}}<\/p><p class=\"sub\" style=\"margin-top: 6px\">{{d.notes}}<\/p><\/div>\n<div>\n<h3>Receipt<\/h3>\n<div style=\"margin-top: 6px\">\n<sc-for list=\"{{d.items}}\" as=\"it\" hint-placeholder-count=\"2\">\n<div class=\"ln\"><span class=\"sub\">{{it.n}}<\/span><span class=\"b\">{{it.p}}<\/span><\/div>\n<\/sc-for>\n<div class=\"ln\" style=\"border-bottom: 0\"><span class=\"b\">Total<\/span><span class=\"b\" style=\"font-size: 16px\">{{d.total}}<\/span><\/div>\n<\/div>\n<\/div>\n<div class=\"row\" style=\"flex-wrap: wrap; gap: 10px\"><a class=\"btn pri\" href=\"Owner-Records.html\">View results &amp; records<\/a><a class=\"btn sec\" href=\"Owner-Billing.html\">View receipt<\/a><a class=\"btn ghost\" href=\"Owner-Book.html\">Book again<\/a><\/div>\n<\/div>\n<\/sc-if>\n<\/section>\n<\/div>\n<\/main>\n\n<sc-if value=\"{{confirmOpen}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"scrim\">\n<section class=\"dlg\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"cx-h\">\n<span class=\"ic\" style=\"background: #FEF3F2; color: #B42318; width: 48px; height: 48px; border-radius: 14px\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><path d=\"M3 10h18M8 3v4M16 3v4M10 14l4 4M14 14l-4 4\"><\/path><\/svg><\/span>\n<div><h2 id=\"cx-h\" style=\"font-size: 20px\">Cancel this appointment?<\/h2><p class=\"sub\" style=\"margin-top: 6px\">{{d.reason}} for Snowball on {{d.when}} with {{d.vet}}.<\/p><\/div>\n<div style=\"background: #F7F9FC; border-radius: 14px; padding: 14px 16px\"><p class=\"sm b\">No fee if you cancel now<\/p><p class=\"xs muted\" style=\"margin-top: 2px\">It's more than 24 hours away. Within 24 hours of the visit, cancelling costs $25.<\/p><\/div>\n<div class=\"fld\"><label for=\"why\">Reason <span class=\"muted\" style=\"font-weight: 400\">(optional, helps the clinic)<\/span><\/label><select class=\"inp\" id=\"why\"><option>Choose a reason<\/option><option>Snowball is feeling better<\/option><option>Time doesn't work anymore<\/option><option>Going to a different clinic<\/option><option>Other<\/option><\/select><\/div>\n<p class=\"xs muted\">Want a different time instead? <a href=\"Owner-Book.html\" style=\"font-weight: 600\">Reschedule<\/a> keeps your spot until you pick a new one.<\/p>\n<div class=\"row\" style=\"justify-content: flex-end; gap: 10px; flex-wrap: wrap\"><button class=\"btn sec\" type=\"button\" onClick=\"{{keep}}\">Keep appointment<\/button><button class=\"btn dangerf\" type=\"button\" onClick=\"{{doCancel}}\">Yes, cancel it<\/button><\/div>\n<\/section>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{toast}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"toast\" role=\"status\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"color: #6BE0F8\"><path d=\"M20 6 9 17l-5-5\"><\/path><\/svg>{{toast}}<button class=\"btn sm\" type=\"button\" style=\"background: transparent; color: #6BE0F8; min-height: 28px; padding: 0 6px\" onClick=\"{{hideToast}}\">Dismiss<\/button><\/div>\n<\/sc-if>\n<\/div>\n");
