<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vetrail clinic · Messages</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/vetrail.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.clinic{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:10px;border-radius:16px;background:#F3F5F8}
.box{display:flex;flex-wrap:wrap;background:#fff;border:1px solid #E8EBF0;border-radius:20px;overflow:hidden;min-height:680px}
.lst{flex:1 1 300px;border-right:1px solid #E8EBF0;display:flex;flex-direction:column;min-width:0}
.th{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #EEF1F4;padding:16px 20px;cursor:pointer;font:inherit;color:inherit}
.th:hover{background:#FAFBFD}
.th.on{background:#EAF2FB}
.conv{flex:2 1 460px;display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;padding:24px;display:flex;flex-direction:column;gap:18px;background:#FAFBFC}
.bub{max-width:520px;padding:14px 16px;border-radius:18px;line-height:1.55}
.them .bub{background:#fff;border:1px solid #E8EBF0;border-top-left-radius:6px}
.mine{align-self:flex-end;align-items:flex-end}
.mine .bub{background:#0B62B5;color:#fff;border-top-right-radius:6px}
.mrow{display:flex;flex-direction:column;gap:6px}
.cmp{display:flex;align-items:center;gap:8px;padding:14px 20px;border-top:1px solid #E8EBF0}
.cmp input{flex:1;min-width:0;border:0;outline:0;font:inherit;background:#F3F5F8;border-radius:12px;min-height:44px;padding:0 14px}
.ctx{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid #E8EBF0;background:#fff;flex-wrap:wrap}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/preact.min.js"></script>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'ear', compose: false }; }
  renderVals() {
    const s = this.state || {};
    const T = [
      { id: 'ear', from: 'Jane Doe', ini: 'JD', subject: 'Potential ear infection', pet: 'Snowball', pi: 'S', pbg: '#CFEFFD', pfg: '#0A4F78', petInfo: 'Husky / Labrador, 6 months · next visit Mar 31', when: '7:41 AM', unread: true,
        msgs: [{ me: false, who: 'Jane Doe', time: 'Today 7:41 AM', text: "I've noticed some concerning symptoms with Snowball that might indicate an ear infection. He has been scratching his ear frequently, shaking his head, and there's a noticeable odor coming from the ear. Please let me know what you recommend." }] },
      { id: 'lab', from: 'Jane Doe', ini: 'JD', subject: 'Lab results ready', pet: 'Snowball', pi: 'S', pbg: '#CFEFFD', pfg: '#0A4F78', petInfo: 'Husky / Labrador, 6 months · next visit Mar 31', when: 'Mar 12', unread: false,
        msgs: [
          { me: true, who: 'You', time: 'Mar 12, 4:15 PM', text: 'Your lab results for Snowball are ready! Please let me know if you have any questions.' },
          { me: false, who: 'Jane Doe', time: 'Mar 12, 5:02 PM', text: 'Thank you so much! Will schedule a follow up appointment.' }
        ] },
      { id: 'mochi', from: 'Kevin Tran', ini: 'KT', subject: 'Diet question', pet: 'Mochi', pi: 'M', pbg: '#FCE3F2', pfg: '#8A1F63', petInfo: 'Shiba Inu, 2 years · next visit Mar 27', when: '9:20 AM', unread: true,
        msgs: [{ me: false, who: 'Kevin Tran', time: 'Today 9:20 AM', text: "Is it okay to switch Mochi to a grain-free food? He's been a bit itchy lately." }] },
      { id: 'bis', from: 'Ana Ruiz', ini: 'AR', subject: 'Surgery prep', pet: 'Biscuit', pi: 'B', pbg: '#FFE6CC', pfg: '#7A3E00', petInfo: 'Beagle, 7 years · consult today 1:00 PM', when: '8:55 AM', unread: true,
        msgs: [{ me: false, who: 'Ana Ruiz', time: 'Today 8:55 AM', text: 'Should Biscuit skip breakfast before the consult this afternoon?' }] },
      { id: 'pep', from: 'Sam Okafor', ini: 'SO', subject: 'Running late', pet: 'Pepper', pi: 'P', pbg: '#E6E0FF', pfg: '#4B2FA8', petInfo: 'Mixed breed, 4 years · today 10:00 AM', when: 'Yesterday', unread: false,
        msgs: [
          { me: false, who: 'Sam Okafor', time: 'Yesterday 6:10 PM', text: 'Can we still make the 10 AM tomorrow if we arrive around 10:10?' },
          { me: true, who: 'You', time: 'Yesterday 6:32 PM', text: 'No problem, see you then!' }
        ] }
    ];
    const cur = T.find((t) => t.id === s.sel) || T[0];
    return {
      isThread: !s.compose, isNew: !!s.compose,
      newMsg: () => this.setState({ compose: true }),
      closeNew: () => this.setState({ compose: false }),
      threads: T.map((t) => ({ ...t, preview: t.msgs[t.msgs.length - 1].text, cls: !s.compose && t.id === cur.id ? 'th on' : 'th', pick: () => this.setState({ sel: t.id, compose: false }) })),
      cur: { ...cur, msgs: cur.msgs.map((m) => ({ ...m, cls: m.me ? 'mrow mine' : 'mrow them' })) }
    };
  }
}
DCLite.mount(Component, "\n\n<div class=\"app\">\n<nav class=\"side\" aria-label=\"Clinic navigation\">\n<a class=\"brand\" href=\"Clinic-Clients.html\"><img src=\"assets/logo.png\" alt=\"\">Vetrail<\/a>\n<div class=\"clinic\"><span class=\"ic\" style=\"background: #073B66; color: #fff; font: 600 13px Outfit, sans-serif\">LA<\/span><div style=\"min-width: 0\"><p class=\"b\">Los Angeles Vet Clinic<\/p><p class=\"xs muted\">Clinic portal<\/p><\/div><\/div>\n<a class=\"nav\" href=\"Clinic-Clients.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"><\/circle><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5.5 5.5 0 0 1 3.5 6\"><\/path><\/svg>Clients<\/a>\n<a class=\"nav\" href=\"Clinic-Calendar.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><path d=\"M3 10h18M8 3v4M16 3v4\"><\/path><\/svg>Calendar<\/a>\n<a class=\"nav on\" href=\"Clinic-Messages.html\" aria-current=\"page\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"><\/path><\/svg>Messages<span class=\"cnt\">3<\/span><\/a>\n<a class=\"nav\" href=\"Clinic-Upload.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 15V3M7 8l5-5 5 5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2\"><\/path><\/svg>Upload results<\/a>\n<div class=\"grow\"><\/div>\n<a class=\"nav\" href=\"#\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h10M18 7h2M4 17h4M12 17h8\"><\/path><circle cx=\"16\" cy=\"7\" r=\"2\"><\/circle><circle cx=\"10\" cy=\"17\" r=\"2\"><\/circle><\/svg>Settings<\/a>\n<a class=\"nav\" href=\"Owner-Login.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11\"><\/path><\/svg>Log out<\/a>\n<div class=\"me\"><span class=\"av\">SD<\/span><div><p class=\"b\">Dr. Sarah Davis<\/p><p class=\"xs muted\">Veterinarian<\/p><\/div><\/div>\n<\/nav>\n\n<main class=\"main\">\n<div class=\"top\">\n<div><h1>Messages<\/h1><p class=\"sub\" style=\"margin-top: 4px\">3 unread · oldest waiting 2 hours<\/p><\/div>\n<button class=\"btn pri\" type=\"button\" onClick=\"{{newMsg}}\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 20h4L19 9l-4-4L4 16zM14 6l4 4\"><\/path><\/svg>New message<\/button>\n<\/div>\n\n<div class=\"box\">\n<div class=\"lst\">\n<div style=\"padding: 16px 20px; border-bottom: 1px solid #EEF1F4\"><label class=\"search\" style=\"flex: none; width: 100%\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"m20 20-3.5-3.5\"><\/path><\/svg><span class=\"sr\">Search messages<\/span><input type=\"search\" placeholder=\"Search clients or pets\"><\/label><\/div>\n<sc-for list=\"{{threads}}\" as=\"t\" hint-placeholder-count=\"5\">\n<button class=\"{{t.cls}}\" type=\"button\" onClick=\"{{t.pick}}\">\n<span class=\"av\">{{t.ini}}<\/span>\n<span style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px\">\n<span class=\"row\" style=\"justify-content: space-between; gap: 8px\"><span class=\"b\" style=\"white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{t.from}}<\/span><span class=\"xs muted\" style=\"white-space: nowrap\">{{t.when}}<\/span><\/span>\n<span class=\"sm\" style=\"color: #3F4A5A\">{{t.subject}} <span class=\"muted\">· {{t.pet}}<\/span><\/span>\n<span class=\"sm muted\" style=\"white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{t.preview}}<\/span>\n<\/span>\n<sc-if value=\"{{t.unread}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"sd\" style=\"background: #0B62B5; margin-top: 6px\" aria-label=\"Unread\"><\/span><\/sc-if>\n<\/button>\n<\/sc-for>\n<\/div>\n\n<sc-if value=\"{{isThread}}\" hint-placeholder-val=\"{{ true }}\">\n<section class=\"conv\" aria-labelledby=\"cv-h\">\n<div class=\"top\" style=\"padding: 18px 24px; border-bottom: 1px solid #E8EBF0\">\n<div><h2 id=\"cv-h\">{{cur.subject}}<\/h2><p class=\"sm muted\">{{cur.from}}<\/p><\/div>\n<a class=\"btn sec sm\" href=\"Clinic-Client.html\">Open client<\/a>\n<\/div>\n<div class=\"ctx\"><span class=\"ic\" style=\"background: {{cur.pbg}}; color: {{cur.pfg}}; width: 36px; height: 36px; border-radius: 10px; font: 600 14px Outfit, sans-serif\">{{cur.pi}}<\/span><p class=\"sm\" style=\"flex: 1\"><b>{{cur.pet}}<\/b> <span class=\"muted\">· {{cur.petInfo}}<\/span><\/p><a class=\"lnk\" href=\"Clinic-Pet.html\">Records<\/a><\/div>\n<div class=\"msgs\">\n<sc-for list=\"{{cur.msgs}}\" as=\"m\" hint-placeholder-count=\"2\">\n<div class=\"{{m.cls}}\">\n<div class=\"row\" style=\"gap: 8px\"><span class=\"xs b\">{{m.who}}<\/span><span class=\"xs muted\">{{m.time}}<\/span><\/div>\n<div class=\"bub\">{{m.text}}<\/div>\n<\/div>\n<\/sc-for>\n<\/div>\n<div class=\"cmp\">\n<button class=\"icob\" type=\"button\" aria-label=\"Attach file\" style=\"border: 0\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7\"><\/path><\/svg><\/button>\n<label class=\"sr\" for=\"rep\">Write a reply<\/label><input id=\"rep\" placeholder=\"Write a reply\">\n<button class=\"btn pri\" type=\"button\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M22 2 11 13M22 2l-7 20-4-9-9-4z\"><\/path><\/svg>Send<\/button>\n<\/div>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{isNew}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"conv\" aria-labelledby=\"nw-h\" style=\"padding: 24px; gap: 18px\">\n<div class=\"top\"><h2 id=\"nw-h\">New message<\/h2><button class=\"btn ghost sm\" type=\"button\" onClick=\"{{closeNew}}\">Cancel<\/button><\/div>\n<div class=\"fld\"><label for=\"to\">To<\/label><input class=\"inp\" id=\"to\" placeholder=\"Search clients\" value=\"Jane Doe\"><\/div>\n<div class=\"fld\"><label for=\"ab\">About pet<\/label><select class=\"inp\" id=\"ab\"><option>Snowball<\/option><option>Cosmo<\/option><\/select><\/div>\n<div class=\"fld\"><label for=\"sj\">Subject<\/label><input class=\"inp\" id=\"sj\" placeholder=\"e.g. Lab results ready\"><\/div>\n<div class=\"fld\" style=\"flex: 1\"><label for=\"bd\">Message<\/label><textarea class=\"inp\" id=\"bd\" style=\"min-height: 180px\"><\/textarea><\/div>\n<div class=\"row\" style=\"justify-content: space-between; flex-wrap: wrap\"><button class=\"btn sec\" type=\"button\">Attach file<\/button><button class=\"btn pri\" type=\"button\" onClick=\"{{closeNew}}\">Send message<\/button><\/div>\n<\/section>\n<\/sc-if>\n<\/div>\n<\/main>\n<\/div>\n");
</script>
</body>
</html>
