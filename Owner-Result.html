<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vetrail · Blood test summary</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/vetrail.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:#5F6B7C}
.crumb a{text-decoration:none;font-weight:500}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5F6B7C}
.read{font-size:15px;line-height:1.7;color:#3F4A5A}
.vr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:14px 0;border-bottom:1px solid #EEF1F4}
.vr:last-child{border-bottom:0}
.trk{position:relative;height:8px;border-radius:999px;background:#EEF1F4;flex:1 1 140px;min-width:120px}
.zone{position:absolute;left:25%;right:25%;top:0;bottom:0;background:#BFE3CE;border-radius:999px}
.mk{position:absolute;top:-5px;width:18px;height:18px;margin-left:-9px;border-radius:999px;border:3px solid #fff;box-shadow:0 0 0 1px #C6CED8;box-sizing:border-box}
.doc{background:#fff;border:1px solid #E8EBF0;border-radius:14px;padding:22px;font-size:12.5px}
.doc table{width:100%;border-collapse:collapse}
.doc th{text-align:left;font-weight:600;color:#5F6B7C;padding:8px 6px;border-bottom:1.5px solid #0F1B2A;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.doc td{padding:7px 6px;border-bottom:1px solid #EEF1F4;font-variant-numeric:tabular-nums}
.doc tr.h td{font-weight:700;background:#FFF6EE}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/preact.min.js"></script>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { all: false }; }
  renderVals() {
    const all = !!(this.state && this.state.all);
    const R = [
      ['ALP', 'Liver and bone enzyme', 163, 'U/L', 5, 160],
      ['ALT', 'Liver enzyme', 61, 'U/L', 18, 121],
      ['AST', 'Liver and muscle enzyme', 27, 'U/L', 16, 55],
      ['Creatine kinase', 'Muscle enzyme', 104, 'U/L', 10, 200],
      ['GGT', 'Liver enzyme', 8, 'U/L', 0, 13],
      ['Albumin', 'Main blood protein', 3.0, 'g/dL', 2.7, 3.9],
      ['Total protein', 'All blood proteins', 6.8, 'g/dL', 5.5, 7.5],
      ['Globulin', 'Immune proteins', 3.8, 'g/dL', 2.4, 4.0],
      ['Total bilirubin', 'Liver function', 0.1, 'mg/dL', 0.0, 0.3],
      ['BUN', 'Kidney waste product', 41, 'mg/dL', 9, 31],
      ['Creatinine', 'Kidney function', 0.9, 'mg/dL', 0.5, 1.5],
      ['Cholesterol', 'Blood fats', 194, 'mg/dL', 131, 345],
      ['Glucose', 'Blood sugar', 92, 'mg/dL', 63, 114],
      ['Calcium', 'Bones, nerves and muscles', 9.7, 'mg/dL', 8.4, 11.8],
      ['Phosphorus', 'Bones and kidneys', 4.1, 'mg/dL', 2.5, 6.1],
      ['Chloride', 'Body water balance', 119, 'mmol/L', 108, 119],
      ['Potassium', 'Nerves and muscles', 4.6, 'mmol/L', 4.0, 5.4],
      ['Sodium', 'Body water balance', 148, 'mmol/L', 142, 152]
    ];
    const flagged = R.filter((v) => v[2] > v[5] || v[2] < v[4]);
    const shown = all ? R : flagged.concat(R.filter((v) => v[0] === 'Creatinine' || v[0] === 'Glucose'));
    const vals = shown.map((v) => {
      const span = v[5] - v[4], min = v[4] - span / 2, max = v[5] + span / 2;
      const pct = Math.max(3, Math.min(97, ((v[2] - min) / (max - min)) * 100));
      const high = v[2] > v[5], low = v[2] < v[4];
      return {
        name: v[0], plain: v[1], val: v[2] + ' ' + v[3], pos: pct.toFixed(1) + '%',
        mc: high || low ? '#D9661F' : '#2F9E6A',
        flag: high ? '↑ High' : low ? '↓ Low' : 'Normal',
        pcls: 'pill ' + (high || low ? 'warn' : 'ok'),
        aria: v[0] + ' ' + v[2] + ', usual range ' + v[4] + ' to ' + v[5]
      };
    });
    const report = R.map((v) => {
      const h = v[2] > v[5];
      return { n: v[0].toUpperCase(), v: String(v[2]), ref: v[4] + ' – ' + v[5] + ' ' + v[3], f: h ? 'H' : '', cls: h ? 'h' : '' };
    });
    return {
      vals, report,
      toggleLabel: all ? 'Show key values' : 'Show all 18',
      toggle: () => this.setState({ all: !all })
    };
  }
}
DCLite.mount(Component, "\n\n<div class=\"app\">\n<nav class=\"side\" aria-label=\"Main navigation\">\n<a class=\"brand\" href=\"index.html\"><img src=\"assets/logo.png\" alt=\"\">Vetrail<\/a>\n<a class=\"petsw\" href=\"Owner-ChoosePet.html\" aria-label=\"Switch pet, current pet Snowball\"><img src=\"assets/snowball.jpg\" alt=\"\"><div style=\"flex: 1; min-width: 0\"><p class=\"b\">Snowball<\/p><p class=\"xs muted\">Switch pet<\/p><\/div><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m7 9 5-5 5 5M7 15l5 5 5-5\"><\/path><\/svg><\/a>\n<a class=\"nav\" href=\"index.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"><\/path><\/svg>Home<\/a>\n<a class=\"nav\" href=\"Owner-Appointments.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><path d=\"M3 10h18M8 3v4M16 3v4\"><\/path><\/svg>Appointments<\/a>\n<a class=\"nav\" href=\"Owner-Messages.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"><\/path><\/svg>Messages<span class=\"cnt\">2<\/span><\/a>\n<a class=\"nav on\" href=\"Owner-Records.html\" aria-current=\"page\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"><\/rect><path d=\"M9 4V3h6v1M9 10h6M9 14h4\"><\/path><\/svg>Health records<\/a>\n<a class=\"nav\" href=\"Owner-Billing.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z\"><\/path><path d=\"M9 8h6M9 12h6\"><\/path><\/svg>Billing<\/a>\n<div class=\"grow\"><\/div>\n<a class=\"nav\" href=\"Owner-Settings.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h10M18 7h2M4 17h4M12 17h8\"><\/path><circle cx=\"16\" cy=\"7\" r=\"2\"><\/circle><circle cx=\"10\" cy=\"17\" r=\"2\"><\/circle><\/svg>Settings<\/a>\n<a class=\"nav\" href=\"Owner-Login.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11\"><\/path><\/svg>Log out<\/a>\n<div class=\"me\"><span class=\"av\">JD<\/span><div><p class=\"b\">Jane Doe<\/p><p class=\"xs muted\">Los Angeles Vet Clinic<\/p><\/div><\/div>\n<\/nav>\n\n<main class=\"main\">\n<div>\n<nav class=\"crumb\" aria-label=\"Breadcrumb\"><a href=\"Owner-Records.html\">Health records<\/a><span aria-hidden=\"true\">/<\/span><a href=\"Owner-Records.html\">Test results<\/a><span aria-hidden=\"true\">/<\/span><span style=\"color: #3F4A5A\">Blood test<\/span><\/nav>\n<h1 style=\"margin-top: 10px\">Blood test results<\/h1>\n<p class=\"sub\" style=\"margin-top: 4px\">CBC + chemistry · collected Mar 10, 2025 · IDEXX Laboratories<\/p>\n<\/div>\n\n<div class=\"wrap\">\n<div class=\"col\" style=\"flex: 1 1 480px\">\n<section class=\"card\" style=\"display: flex; flex-direction: column; gap: 20px\" aria-labelledby=\"sum-h\">\n<div class=\"row\" style=\"flex-wrap: wrap; gap: 10px\">\n<span class=\"pill ai\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z\"><\/path><\/svg>AI-generated summary<\/span>\n<span class=\"sm muted row\" style=\"gap: 6px\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"color: #12663D\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\/path><path d=\"m9 12 2 2 4-4\"><\/path><\/svg>Reviewed by Dr. Sarah Davis on Mar 12<\/span>\n<\/div>\n<h2 id=\"sum-h\" style=\"font-size: 24px; line-height: 1.25\">Mostly normal, with one value to keep an eye on.<\/h2>\n<div>\n<p class=\"eyebrow\">Test overview<\/p>\n<p class=\"read\" style=\"margin-top: 6px\">Snowball's blood test provides insights into his overall health by examining various blood components like red and white blood cells, platelets, and organ function indicators.<\/p>\n<\/div>\n<div>\n<p class=\"eyebrow\">Conclusion<\/p>\n<p class=\"read\" style=\"margin-top: 6px\">Snowball's overall blood results are mostly normal, but the slight elevation in Blood Urea Nitrogen (BUN) may indicate mild dehydration. No immediate concerns are noted, but keeping an eye on hydration and rechecking in the future is advised.<\/p>\n<\/div>\n<div style=\"background: #F7F9FC; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n<h3>Suggested next step<\/h3>\n<p class=\"sm sub\">Make sure Snowball always has fresh water. Dr. Davis suggests a recheck in 2–3 weeks.<\/p>\n<div class=\"row\" style=\"flex-wrap: wrap; gap: 10px\"><a class=\"btn pri\" href=\"Owner-Book.html\">Book recheck<\/a><a class=\"btn sec\" href=\"Owner-Messages.html\">Ask Dr. Davis<\/a><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" aria-labelledby=\"an-h\">\n<div class=\"hd\" style=\"margin-bottom: 4px\"><div><h2 id=\"an-h\">Full analysis<\/h2><p class=\"xs muted\">Green band is the usual range for dogs<\/p><\/div><button class=\"btn sec sm\" type=\"button\" onClick=\"{{toggle}}\">{{toggleLabel}}<\/button><\/div>\n<sc-for list=\"{{vals}}\" as=\"v\" hint-placeholder-count=\"4\">\n<div class=\"vr\">\n<div style=\"flex: 1 1 150px; min-width: 0\"><h3 style=\"font-size: 14px\">{{v.name}}<\/h3><p class=\"xs muted\">{{v.plain}}<\/p><\/div>\n<p class=\"b\" style=\"width: 96px; font-variant-numeric: tabular-nums\">{{v.val}}<\/p>\n<div class=\"trk\" role=\"img\" aria-label=\"{{v.aria}}\"><span class=\"zone\"><\/span><span class=\"mk\" style=\"left: {{v.pos}}; background: {{v.mc}}\"><\/span><\/div>\n<span class=\"{{v.pcls}}\" style=\"width: 80px; justify-content: center\">{{v.flag}}<\/span>\n<\/div>\n<\/sc-for>\n<\/section>\n<p class=\"xs muted\">This summary explains your results in plain language. It doesn't replace advice from your vet. If Snowball stops eating, vomits or seems very tired, call (323) 555-0147.<\/p>\n<\/div>\n\n<section class=\"card\" style=\"flex: 1 1 440px; background: #F7F9FC\" aria-labelledby=\"or-h\">\n<div class=\"hd\"><div><h2 id=\"or-h\">Original lab report<\/h2><p class=\"xs muted\">As sent by IDEXX Laboratories<\/p><\/div><button class=\"btn sec sm\" type=\"button\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3v12M7 10l5 5 5-5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2\"><\/path><\/svg>PDF<\/button><\/div>\n<div class=\"doc\">\n<div class=\"row\" style=\"justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid #E8EBF0; margin-bottom: 8px\">\n<div><p class=\"b\" style=\"font-size: 14px; letter-spacing: .08em\">IDEXX LABORATORIES<\/p><p class=\"muted\">HealthChek Plus · Chem 25 w/ SDMA<\/p><\/div>\n<div style=\"text-align: right\"><p><span class=\"muted\">Patient<\/span> <b>Snowball<\/b><\/p><p><span class=\"muted\">Owner<\/span> Doe, Jane<\/p><p><span class=\"muted\">Reported<\/span> 03/11/2025<\/p><\/div>\n<\/div>\n<table>\n<thead><tr><th scope=\"col\">Test<\/th><th scope=\"col\">Result<\/th><th scope=\"col\">Reference<\/th><th scope=\"col\">Flag<\/th><\/tr><\/thead>\n<tbody>\n<sc-for list=\"{{report}}\" as=\"r\" hint-placeholder-count=\"18\">\n<tr class=\"{{r.cls}}\"><td>{{r.n}}<\/td><td>{{r.v}}<\/td><td class=\"muted\">{{r.ref}}<\/td><td>{{r.f}}<\/td><\/tr>\n<\/sc-for>\n<\/tbody>\n<\/table>\n<p class=\"xs muted\" style=\"margin-top: 12px\">Final report · page 1 of 2<\/p>\n<\/div>\n<\/section>\n<\/div>\n<\/main>\n<\/div>\n");
</script>
</body>
</html>
