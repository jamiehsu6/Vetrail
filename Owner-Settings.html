<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vetrail · Settings</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/vetrail.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.sn{display:flex;flex-direction:column;gap:2px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid #EEF1F4;margin-bottom:6px}
.fr{display:grid;grid-template-columns:minmax(140px,220px) minmax(0,1fr);gap:8px 24px;padding:14px 0;border-bottom:1px solid #EEF1F4;align-items:center}
.fr:last-child{border-bottom:0}
.fr dt{color:#5F6B7C}.fr dd{margin:0;font-weight:500}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.tg{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid #EEF1F4}
.tg:last-child{border-bottom:0}
.sw{width:44px;height:26px;border-radius:999px;border:0;background:#C6CED8;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:#fff;transition:left .15s}
.sw.on{background:#0B62B5}
.sw.on::after{left:21px}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/preact.min.js"></script>
<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sec: 'profile', editing: false, n: { appt: true, res: true, msg: true, bill: false } }; }
  renderVals() {
    const s = this.state || {};
    const sec = s.sec || 'profile';
    const n = s.n || {};
    const S = [
      { id: 'profile', label: 'Profile', icon: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0' },
      { id: 'notif', label: 'Notifications', icon: 'M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0' },
      { id: 'pets', label: 'Pets & clinic', icon: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z' },
      { id: 'sec', label: 'Security', icon: 'M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4' }
    ];
    const TG = [
      ['appt', 'Appointment reminders', 'A day before and an hour before'],
      ['res', 'New test results', 'When your vet shares a summary'],
      ['msg', 'Messages from the clinic', 'Email and push'],
      ['bill', 'Billing updates', 'New bills and payment receipts']
    ];
    return {
      secs: S.map((x) => ({ ...x, cls: x.id === sec ? 'nav on' : 'nav', bg: x.id === sec ? '#EAF2FB' : 'transparent', pick: () => this.setState({ sec: x.id, editing: false }) })),
      isProfile: sec === 'profile', isNotif: sec === 'notif', isPets: sec === 'pets', isSec: sec === 'sec',
      editing: !!s.editing, notEditing: !s.editing,
      edit: () => this.setState({ editing: true }), done: () => this.setState({ editing: false }),
      toggles: TG.map((t) => ({ label: t[1], hint: t[2], on: n[t[0]] ? 'true' : 'false', cls: n[t[0]] ? 'sw on' : 'sw', flip: () => this.setState({ n: { ...n, [t[0]]: !n[t[0]] } }) }))
    };
  }
}
DCLite.mount(Component, "\n\n<div class=\"app\">\n<nav class=\"side\" aria-label=\"Main navigation\">\n<a class=\"brand\" href=\"index.html\"><img src=\"assets/logo.png\" alt=\"\">Vetrail<\/a>\n<a class=\"nav\" href=\"index.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"><\/path><\/svg>Home<\/a>\n<a class=\"nav\" href=\"Owner-Appointments.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\/rect><path d=\"M3 10h18M8 3v4M16 3v4\"><\/path><\/svg>Appointments<\/a>\n<a class=\"nav\" href=\"Owner-Messages.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"><\/path><\/svg>Messages<span class=\"cnt\">2<\/span><\/a>\n<a class=\"nav\" href=\"Owner-Records.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"><\/rect><path d=\"M9 4V3h6v1M9 10h6M9 14h4\"><\/path><\/svg>Health records<\/a>\n<a class=\"nav\" href=\"Owner-Billing.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z\"><\/path><path d=\"M9 8h6M9 12h6\"><\/path><\/svg>Billing<\/a>\n<div class=\"grow\"><\/div>\n<a class=\"nav on\" href=\"Owner-Settings.html\" aria-current=\"page\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 7h10M18 7h2M4 17h4M12 17h8\"><\/path><circle cx=\"16\" cy=\"7\" r=\"2\"><\/circle><circle cx=\"10\" cy=\"17\" r=\"2\"><\/circle><\/svg>Settings<\/a>\n<a class=\"nav\" href=\"Owner-Login.html\"><svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11\"><\/path><\/svg>Log out<\/a>\n<div class=\"me\"><span class=\"av\">JD<\/span><div><p class=\"b\">Jane Doe<\/p><p class=\"xs muted\">Los Angeles Vet Clinic<\/p><\/div><\/div>\n<\/nav>\n\n<main class=\"main\">\n<div><h1>Settings<\/h1><p class=\"sub\" style=\"margin-top: 4px\">Manage your profile, pets and notifications<\/p><\/div>\n\n<div class=\"wrap\">\n<section class=\"card\" style=\"flex: 0 1 260px; padding: 20px\" aria-label=\"Settings sections\">\n<div class=\"row\" style=\"padding: 4px 4px 18px; border-bottom: 1px solid #EEF1F4; margin-bottom: 10px\"><span class=\"av lg\">JD<\/span><div><p class=\"b\">Jane Doe<\/p><p class=\"xs muted\">jane.doe@email.com<\/p><\/div><\/div>\n<div class=\"sn\">\n<sc-for list=\"{{secs}}\" as=\"s\" hint-placeholder-count=\"4\">\n<button class=\"{{s.cls}}\" type=\"button\" onClick=\"{{s.pick}}\" style=\"border: 0; background: {{s.bg}}; width: 100%; cursor: pointer; font: inherit; text-align: left\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"{{s.icon}}\"><\/path><\/svg>{{s.label}}<\/button>\n<\/sc-for>\n<\/div>\n<\/section>\n\n<div class=\"col\" style=\"flex: 1 1 520px\">\n<sc-if value=\"{{isProfile}}\" hint-placeholder-val=\"{{ true }}\">\n<section class=\"card\" aria-labelledby=\"bi-h\">\n<div class=\"sec-h\"><h2 id=\"bi-h\">Basic information<\/h2>\n<sc-if value=\"{{notEditing}}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn sec sm\" type=\"button\" onClick=\"{{edit}}\"><svg class=\"i s\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 20h4L19 9l-4-4L4 16zM14 6l4 4\"><\/path><\/svg>Edit<\/button><\/sc-if>\n<\/div>\n<sc-if value=\"{{notEditing}}\" hint-placeholder-val=\"{{ true }}\">\n<dl style=\"margin: 0\">\n<div class=\"fr\"><dt>Name<\/dt><dd>Jane Doe<\/dd><\/div>\n<div class=\"fr\"><dt>Birthday<\/dt><dd>June 4, 1992<\/dd><\/div>\n<div class=\"fr\"><dt>Gender<\/dt><dd>Female<\/dd><\/div>\n<\/dl>\n<\/sc-if>\n<sc-if value=\"{{editing}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; padding-top: 10px\">\n<div class=\"two\">\n<div class=\"fld\"><label for=\"fn\">First name<\/label><input class=\"inp\" id=\"fn\" value=\"Jane\"><\/div>\n<div class=\"fld\"><label for=\"ln\">Last name<\/label><input class=\"inp\" id=\"ln\" value=\"Doe\"><\/div>\n<div class=\"fld\"><label for=\"bd\">Birthday<\/label><input class=\"inp\" id=\"bd\" value=\"06 / 04 / 1992\"><\/div>\n<div class=\"fld\"><label for=\"gd\">Gender<\/label><select class=\"inp\" id=\"gd\"><option>Female<\/option><option>Male<\/option><option>Non-binary<\/option><option>Prefer not to say<\/option><\/select><\/div>\n<\/div>\n<div class=\"row\" style=\"justify-content: flex-end; gap: 10px\"><button class=\"btn ghost\" type=\"button\" onClick=\"{{done}}\">Cancel<\/button><button class=\"btn pri\" type=\"button\" onClick=\"{{done}}\">Save changes<\/button><\/div>\n<\/div>\n<\/sc-if>\n<\/section>\n\n<section class=\"card\" aria-labelledby=\"ci-h\">\n<div class=\"sec-h\"><h2 id=\"ci-h\">Contact &amp; account<\/h2><button class=\"btn sec sm\" type=\"button\">Edit<\/button><\/div>\n<dl style=\"margin: 0\">\n<div class=\"fr\"><dt>Email<\/dt><dd>jane.doe@email.com<\/dd><\/div>\n<div class=\"fr\"><dt>Phone<\/dt><dd>(323) 555-0182<\/dd><\/div>\n<div class=\"fr\"><dt>Address<\/dt><dd>2210 W 54th St, Los Angeles, CA 90043<\/dd><\/div>\n<div class=\"fr\"><dt>Password<\/dt><dd>Last changed 3 months ago<\/dd><\/div>\n<\/dl>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{isNotif}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"card\" aria-labelledby=\"nt-h\">\n<div class=\"sec-h\"><h2 id=\"nt-h\">Notifications<\/h2><\/div>\n<sc-for list=\"{{toggles}}\" as=\"t\" hint-placeholder-count=\"4\">\n<div class=\"tg\"><div><p class=\"b\">{{t.label}}<\/p><p class=\"sm muted\">{{t.hint}}<\/p><\/div><button class=\"{{t.cls}}\" type=\"button\" role=\"switch\" aria-checked=\"{{t.on}}\" aria-label=\"{{t.label}}\" onClick=\"{{t.flip}}\"><\/button><\/div>\n<\/sc-for>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{isPets}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"card\" aria-labelledby=\"pt-h\">\n<div class=\"sec-h\"><h2 id=\"pt-h\">Pets &amp; clinic<\/h2><a class=\"btn sec sm\" href=\"Owner-Signup.html\">Add a pet<\/a><\/div>\n<div class=\"li\"><img src=\"assets/snowball.jpg\" alt=\"\" style=\"width: 48px; height: 48px; border-radius: 14px; object-fit: cover\"><div style=\"flex: 1\"><p class=\"b\">Snowball<\/p><p class=\"xs muted\">ID 201794325 · Husky / Labrador<\/p><\/div><span class=\"pill ok\">Connected<\/span><\/div>\n<div class=\"li\"><span class=\"ic\" style=\"background: #FFE6CC; color: #7A3E00; width: 48px; height: 48px; border-radius: 14px; font: 600 18px Outfit, sans-serif\">C<\/span><div style=\"flex: 1\"><p class=\"b\">Cosmo<\/p><p class=\"xs muted\">ID 234987382 · Goldendoodle<\/p><\/div><span class=\"pill ok\">Connected<\/span><\/div>\n<div style=\"margin-top: 14px; background: #F7F9FC; border-radius: 14px; padding: 16px\"><p class=\"sm muted\">Your clinic<\/p><p class=\"b\" style=\"margin-top: 2px\">Los Angeles Vet Clinic<\/p><p class=\"sm sub\">1544 W Slauson Ave, Los Angeles, CA 90047 · (323) 555-0147<\/p><\/div>\n<\/section>\n<\/sc-if>\n\n<sc-if value=\"{{isSec}}\" hint-placeholder-val=\"{{ false }}\">\n<section class=\"card\" aria-labelledby=\"sc-h\">\n<div class=\"sec-h\"><h2 id=\"sc-h\">Security<\/h2><\/div>\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 420px; padding-top: 8px\">\n<div class=\"fld\"><label for=\"cp\">Current password<\/label><input class=\"inp\" id=\"cp\" type=\"password\"><\/div>\n<div class=\"fld\"><label for=\"np\">New password<\/label><input class=\"inp\" id=\"np\" type=\"password\" placeholder=\"At least 8 characters\"><\/div>\n<button class=\"btn pri\" type=\"button\" style=\"align-self: flex-start\">Update password<\/button>\n<\/div>\n<\/section>\n<\/sc-if>\n<\/div>\n<\/div>\n<\/main>\n<\/div>\n");
</script>
</body>
</html>
